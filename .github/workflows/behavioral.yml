name: behavioral

# Drives the full behavioral suite (tests/behavioral/run-all.mjs) against
# the live prod deployment. Two modes:
#
#   - pr-strict: runs on every PR to main. `--no-retry`. Any RED probe
#     blocks merge (when configured as a required check in repo settings;
#     see .github/workflows/README.md for the one-time setup).
#
#   - main-with-retry: runs on every push to main. Retry-on-banner
#     enabled (matches local-dev semantics). Tracks post-merge state and
#     surfaces flakes without blocking.
#
# The prod deployment is the artifact under test — BASE points at the
# public Workers URL. No secrets, no auth, no local wrangler dev. If a
# sibling deploy clobbers prod mid-run, the runner's built-in retry
# absorbs short windows; sustained outages surface as a mass-fail
# (intentional — that's what CI should catch).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs for the same ref when a new commit arrives.
# Saves runner minutes when contributors push amend-fix-amend on a PR.
concurrency:
  group: behavioral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The authenticated probe deployment (apps/probe). The public hosted
  # demo at nimbus-os.dev stays behind interactive
  # Cloudflare login; CI authenticates here with a freshly minted JWT
  # (see the "Mint probe token" step).
  BASE: https://nimbus-probe.ashishkmr472.workers.dev
  # Skipped probes:
  #   - frameworks/markflow-*: expensive real-repo installs; run them
  #     manually/on demand only (operator cost directive).
  #   - sdk/new/live-sdk-*-smoke + auth/new/hosted-demo-*: exercise
  #     hosted-demo-only surfaces (demo OAuth, /api/sdk-smoke) that do
  #     not exist on the probe target.
  NIMBUS_PROBE_SKIP: frameworks/markflow-clickthrough,frameworks/markflow-real,sdk/new/live-sdk-smoke,sdk/new/live-sdk-remote-smoke,auth/new/hosted-demo-browser-auth,auth/new/hosted-demo-launch-oauth

jobs:
  pr-strict:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    name: PR-strict (no-retry)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        shell: bash
        run: for f in tests/unit/*.mjs; do echo "== $f"; bun "$f" || exit 1; done

      - name: Mint probe token
        shell: bash
        env:
          NIMBUS_PROBE_JWT_SECRET: ${{ secrets.NIMBUS_PROBE_JWT_SECRET }}
          # The full suite runs ~1h; the default 1h TTL expires mid-run and
          # the alphabetical tail fails with 401s at mint-session.
          NIMBUS_PROBE_TOKEN_TTL_MS: "10800000"
        run: |
          TOKEN="$(bun tests/behavioral/_mint-probe-token.mjs)"
          echo "::add-mask::$TOKEN"
          echo "NIMBUS_PROBE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run behavioral suite (strict, no retry)
        id: run
        # Explicit `shell: bash` runs with `-o pipefail`, so the
        # runner's exit code survives the `| tee` pipeline.
        shell: bash
        run: bun tests/behavioral/run-all.mjs --no-retry | tee behavioral.log
        # `| tee` preserves CI live-log AND saves a file we upload on
        # both PASS and FAIL paths via `if: always()` below.

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-log-pr-${{ github.event.pull_request.number || github.run_id }}
          path: behavioral.log
          retention-days: 30

  main-with-retry:
    if: github.event_name == 'push'
    name: main (with retry-on-banner)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        shell: bash
        run: for f in tests/unit/*.mjs; do echo "== $f"; bun "$f" || exit 1; done

      - name: Mint probe token
        shell: bash
        env:
          NIMBUS_PROBE_JWT_SECRET: ${{ secrets.NIMBUS_PROBE_JWT_SECRET }}
          # The full suite runs ~1h; the default 1h TTL expires mid-run and
          # the alphabetical tail fails with 401s at mint-session.
          NIMBUS_PROBE_TOKEN_TTL_MS: "10800000"
        run: |
          TOKEN="$(bun tests/behavioral/_mint-probe-token.mjs)"
          echo "::add-mask::$TOKEN"
          echo "NIMBUS_PROBE_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Run behavioral suite (retry-on-banner enabled)
        id: run
        shell: bash
        run: bun tests/behavioral/run-all.mjs | tee behavioral.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-log-main-${{ github.run_id }}
          path: behavioral.log
          retention-days: 90
