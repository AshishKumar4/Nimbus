name: behavioral

# Deploys the commit under test and runs the full behavioral suite
# (tests/behavioral/run-all.mjs) against it.
#
# WHY THERE IS A DEPLOY STEP
#   A Nimbus session is a deployed Worker plus a Durable Object; there is
#   no local stand-in, so the suite needs something deployed to talk to.
#   This job used to point BASE at `nimbus-probe` and grade whatever was
#   already running there. Nothing deployed to it, so from 2026-07-24
#   onward every green run certified a twelve-day-old deployment — the
#   PR's code was never executed. A check that cannot fail for the reason
#   you care about is worse than no check, because it reads as evidence.
#
#   So the job now builds this commit, deploys it, and grades that.
#
# WHY A THROWAWAY AND NOT `nimbus-staging`
#   Two PRs sharing one target grade each other's code — the same defect
#   again, only faster and harder to see. A throwaway is named per run,
#   deleted after it, and mints its own JWT_SECRET, so no token outlives
#   the target it opens and no shared signing secret is needed here at
#   all. It is a Worker Preview (`wrangler preview`) of
#   `nimbus-probe-previews`, a parent Worker with no production deployment:
#   each Preview gets its own Durable Object namespace and storage, and
#   deleting it deletes them. `nimbus-staging` stays what the
#   promote-to-prod runbook needs: a stable pre-production a human can
#   browser-check, not something CI redeploys under them on every push.
#   See AGENTS.md § Staging And Promote.
#
#   `nimbus` (production) and `nimbus-probe` are never deploy targets
#   here. The throwaway path runs the isolation preflight on apps/probe's
#   `previews` block before it invokes wrangler, and asserts the deploy
#   landed by the Preview's latest deployment id — `wrangler deploy` has
#   failed in asset upload and still exited 0.
#
# MODES
#   pull_request / workflow_dispatch — `--no-retry`. Any RED is a RED.
#   push to main                     — retry-on-banner, matching local-dev
#                                      semantics, so a known runtime crash
#                                      does not read as a regression.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Cancel in-flight runs for the same ref when a new commit arrives.
# Saves runner minutes when contributors push amend-fix-amend on a PR.
# A cancelled run may not reach its teardown step; every throwaway this
# workflow creates is a Preview named `tw-ci-*` under `nimbus-probe-previews`,
# and `bun tests/behavioral/_throwaway-target.mjs list` lists every Preview
# there, marking the strays no checkout holds.
concurrency:
  group: behavioral-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Two Cloudflare accounts are logged in on the maintainer's machine and
  # wrangler picks one silently, so every deploy pins the account. The
  # deploy scripts require the pin; CI supplies it here.
  CLOUDFLARE_ACCOUNT_ID: f44999d1ddda7012e9a87729eba250f1
  # One name per run, recorded before the deploy so teardown can find it
  # even when the deploy fails halfway — a failed deploy can still create
  # the Preview. `_throwaway-target.mjs` names it `tw-<TARGET_NAME>`.
  TARGET_NAME: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  # The three fast gates run as parallel jobs so a slow one never holds
  # the others hostage, and a red one is visible as its own check. None
  # of them deploys anything; the throwaway deploy + probes is the job
  # that needs them, below.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The bun the repository is developed and verified with; `latest` let CI's
          # bundler and resolver drift from it (bun 1.4.2 dropped a side effect 1.4.0 keeps).
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    # The suite runs on armada (Cloudflare Containers): `armada run` plans it
    # into parts (scripts/ci/unit.mjs) and runs them on containers; this job
    # only packs the commit, follows the run and prints the verdict. Run here
    # on one runner, the suite did not fit this job's old 15 minutes: of 20
    # runs from 2026-10-03 to 10-06, none passed and 19 were cancelled.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The bun the repository is developed and verified with; `latest` let CI's
          # bundler and resolver drift from it (bun 1.4.2 dropped a side effect 1.4.0 keeps).
          bun-version: 1.4.0

      # The armada client remote-unit requires: a clean checkout of exactly
      # the commit scripts/ci/lib/armada.mjs pins (ARMADA_CLIENT).
      - name: Check out the armada client
        run: |
          pin=$(bun -e "console.log((await import('./scripts/ci/lib/armada.mjs')).ARMADA_CLIENT)")
          git clone --quiet https://github.com/AshishKumar4/armada "$RUNNER_TEMP/armada"
          git -C "$RUNNER_TEMP/armada" checkout --quiet --detach "$pin"
          (cd "$RUNNER_TEMP/armada" && bun install --frozen-lockfile --production)

      # scripts/ci/remote-unit.mjs is the same command every lane runs:
      # `armada run` on the commit. It exits 0 on pass, 1 when a test
      # failed, 2 when the run could not grade the commit. Its red status
      # never decides whether the probes run (see the behavioral job's `if:`).
      - name: Run unit tests on armada
        env:
          ARMADA_DIR: ${{ runner.temp }}/armada
          ARMADA_URL: ${{ secrets.ARMADA_URL }}
          ARMADA_TOKEN: ${{ secrets.ARMADA_TOKEN }}
        run: bun scripts/ci/remote-unit.mjs "$GITHUB_SHA" --label "github ${{ github.event_name }} ${{ github.run_id }}"

  dist-integrity:
    name: dist-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The bun the repository is developed and verified with; `latest` let CI's
          # bundler and resolver drift from it (bun 1.4.2 dropped a side effect 1.4.0 keeps).
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # scripts/dist-integrity.mjs rebuilds every package (the
      # build/bundle/build fixpoint) and refuses when the rebuild moved
      # anything — a commit whose committed dist does not match its src
      # fails HERE rather than being graded as if it did. A warm
      # fixpoint record verifies in seconds; a fresh checkout rebuilds
      # cold. The throwaway deploy runs the same gate again before
      # deploying, so this job surfaces a stale dist earlier, in
      # parallel with the other fast gates.
      - name: Verify dist is the fixpoint of src
        run: node scripts/dist-integrity.mjs

  behavioral:
    name: behavioral
    runs-on: ubuntu-latest
    needs: [typecheck, unit, dist-integrity]
    # The probes still run when a fast gate is red. Twice now a single
    # failing unit test has silently disabled the behavioral gate (once
    # on stale tests referencing removed APIs, once on a
    # checkout-scaling assertion that failed roughly one run in three on
    # a busy machine), and in both cases every push looked green-ish
    # while ~380 probes had not executed. A red gate must not decide
    # whether the probes execute: each job's own status carries its
    # signal, and the probes add theirs. Only a cancelled workflow skips
    # them.
    if: ${{ !cancelled() }}
    # ~430 probes, 16 at a time, plus a build and a deploy.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # The bun the repository is developed and verified with; `latest` let CI's
          # bundler and resolver drift from it (bun 1.4.2 dropped a side effect 1.4.0 keeps).
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # On the record: which fast gates passed. Informational only — the
      # `if:` above already decided the probes run regardless.
      - name: Fast-gate results
        run: |
          echo "typecheck: ${{ needs.typecheck.result }} / unit: ${{ needs.unit.result }} / dist-integrity: ${{ needs.dist-integrity.result }}"

      - name: Require deploy credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set, so this commit cannot be deployed and there is nothing to grade. Add it as a repo secret (Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Workers KV Storage:Edit on account $CLOUDFLARE_ACCOUNT_ID). This job fails here deliberately rather than falling back to a shared deployment: grading whatever happened to be deployed elsewhere is what made every earlier green run meaningless."
            exit 1
          fi

      - name: Deploy this commit to a throwaway target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # `up` runs the dist-integrity gate (the build/bundle/build fixpoint,
        # then a refusal if rebuilding changed anything — so a commit whose
        # committed dist does not match its src fails HERE rather than being
        # graded as if it did), runs the isolation preflight on apps/probe's
        # `previews` block, deploys apps/probe as a Preview of
        # nimbus-probe-previews with a freshly generated JWT_SECRET in the
        # deployment, verifies the Preview's latest deployment id changed,
        # and mints a matching token. It prints the two exports on stdout;
        # its progress log goes to stderr.
        run: |
          bun tests/behavioral/_throwaway-target.mjs up --name "$TARGET_NAME" > target.env
          BASE="$(sed -n 's/^export BASE=//p' target.env)"
          TOKEN="$(sed -n 's/^export NIMBUS_PROBE_TOKEN=//p' target.env)"
          rm -f target.env
          if [ -z "$BASE" ] || [ -z "$TOKEN" ]; then
            echo "::error::the throwaway deploy printed no BASE/token — refusing to run the suite against an unknown target"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "BASE=$BASE" >> "$GITHUB_ENV"
          echo "NIMBUS_PROBE_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "grading $BASE (nimbus-tw-$TARGET_NAME), built from $GITHUB_SHA"

      - name: Resolve skipped probes
        shell: bash
        # tests/behavioral/_probe-target-skips.mjs is the one list, shared
        # with `bun run staging:test`, so the two runs cannot drift.
        run: echo "NIMBUS_PROBE_SKIP=$(bun tests/behavioral/_probe-target-skips.mjs)" >> "$GITHUB_ENV"

      - name: Run behavioral suite
        shell: bash
        # Explicit `shell: bash` runs with `-o pipefail`, so the runner's
        # exit code survives the `| tee` pipeline. `| tee` preserves the CI
        # live-log AND saves a file, uploaded below on both PASS and FAIL.
        # The runner's default pool (16 probes at once): each probe mints
        # its own session and owns its own browsers, and most of its time
        # is spent waiting on the target.
        # --ledger keeps the run's session ledger beside the log: every
        # session a probe minted, when, and its DELETE, so a session that
        # reset is looked up in Workers Logs by its session.
        run: |
          bun tests/behavioral/run-all.mjs --ledger probe-ledger.jsonl \
            ${{ github.event_name == 'push' && ' ' || '--no-retry' }} | tee behavioral.log

      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: behavioral-log-${{ github.event_name }}-${{ github.run_id }}
          path: |
            behavioral.log
            probe-ledger.jsonl
          if-no-files-found: warn
          retention-days: 90

      - name: Delete the throwaway target
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        # `down` deletes the Preview (and with it its Durable Object storage)
        # and then confirms against the API that it is gone — a 404 on the
        # hostname alone does not mean it is. It exits non-zero when it
        # cannot confirm, so a leak is loud.
        run: bun tests/behavioral/_throwaway-target.mjs down --name "$TARGET_NAME"
