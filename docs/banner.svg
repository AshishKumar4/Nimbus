<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Nimbus — a cloud OS on Cloudflare Durable Objects">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#101a33"/>
      <stop offset="1" stop-color="#0b1226"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#f0abfc"/>
    </linearGradient>
    <linearGradient id="hairline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#e879f9" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.1" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#818cf8" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0b1020" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="16" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="15.5" fill="none" stroke="#334155" stroke-opacity="0.6"/>

  <!-- isolate fabric motif: one supervisor, a ring of facets -->
  <g transform="translate(1020,160)" stroke-linecap="round">
    <g stroke="#64748b" stroke-opacity="0.5" stroke-width="1.5" fill="none">
      <path d="M0 0 L-118 -66"/><path d="M0 0 L-128 22"/><path d="M0 0 L-62 96"/>
      <path d="M0 0 L74 -92"/><path d="M0 0 L128 -18"/><path d="M0 0 L92 78"/>
    </g>
    <g fill="#0f172a" stroke="#475569" stroke-width="1.5">
      <rect x="-134" y="-82" width="32" height="32" rx="7"/>
      <rect x="-144" y="6" width="32" height="32" rx="7"/>
      <rect x="-78" y="80" width="32" height="32" rx="7"/>
      <rect x="58" y="-108" width="32" height="32" rx="7"/>
      <rect x="112" y="-34" width="32" height="32" rx="7"/>
      <rect x="76" y="62" width="32" height="32" rx="7"/>
    </g>
    <g fill="none" stroke-width="2">
      <rect x="-118" y="-66" width="0.1" height="0.1" stroke="none"/>
      <path d="M-126 -66 h16" stroke="#7dd3fc" stroke-opacity="0.85"/>
      <path d="M-136 22 h16" stroke="#a5b4fc" stroke-opacity="0.85"/>
      <path d="M-70 96 h16" stroke="#f0abfc" stroke-opacity="0.85"/>
      <path d="M66 -92 h16" stroke="#a5b4fc" stroke-opacity="0.85"/>
      <path d="M120 -18 h16" stroke="#7dd3fc" stroke-opacity="0.85"/>
      <path d="M84 78 h16" stroke="#f0abfc" stroke-opacity="0.85"/>
    </g>
    <circle r="30" fill="#0f172a" stroke="#7dd3fc" stroke-width="2"/>
    <circle r="30" fill="none" stroke="#7dd3fc" stroke-opacity="0.25" stroke-width="8"/>
    <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#e2e8f0">DO</text>
  </g>

  <!-- wordmark + tagline -->
  <g transform="translate(84,0)">
    <text x="0" y="150" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="2" fill="url(#wordmark)">Nimbus</text>
    <rect x="4" y="172" width="560" height="2" fill="url(#hairline)"/>
    <text x="4" y="210" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#cbd5e1">A POSIX-like cloud OS on Cloudflare Durable Objects.</text>
    <text x="4" y="244" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#94a3b8">Every agent gets its own computer.</text>
  </g>

  <!-- terminal line -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19">
    <text x="88" y="288" fill="#34d399">user@nimbus</text>
    <text x="212" y="288" fill="#64748b">:</text>
    <text x="222" y="288" fill="#7dd3fc">~</text>
    <text x="236" y="288" fill="#64748b">$</text>
    <text x="256" y="288" fill="#e2e8f0">git clone · npm install · python · ruby · clang · bash</text>
    <rect x="836" y="272" width="11" height="20" fill="#e2e8f0">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
