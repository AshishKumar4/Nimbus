      - packages/core/src/vfs/sqlite-vfs.ts#SqliteVFS.committedRows
      - packages/core/src/vfs/sqlite-vfs.ts#SqliteVFS.executeTransactionPlan
    refinement:
      - lean/fixtures/revision-floor.json :: tests/unit/revision-floor-refinement.mjs
    remainingEvidence:
      - The log is modeled as what bumpRevision records for one publication (logRev), not as the bounded list invalidatedSince reads; merging entries per path at the newest is the fixture's, and the refinement test compares invalidatedSince's answer with it
      - The delta from SQLite (invalidatedFromSql) is not modeled; tests/unit/sqlite-vfs-range-revision.mjs checks that it names a file at the revision the file reports
