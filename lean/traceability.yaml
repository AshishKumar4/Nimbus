      - Nimbus.Vfs.RevisionFloor.under_refl
      - Nimbus.Vfs.RevisionFloor.under_trans
      - Nimbus.Vfs.RevisionFloor.under_ne_nil
      - Nimbus.Vfs.RevisionFloor.under_cases
      - Nimbus.Vfs.RevisionFloor.under_dropLast
      - Nimbus.Vfs.RevisionFloor.under_length
      - Nimbus.Vfs.RevisionFloor.walked_closed
      - Nimbus.Vfs.RevisionFloor.bump_inv
      - Nimbus.Vfs.RevisionFloor.drop_inv
      - Nimbus.Vfs.RevisionFloor.forget_inv
      - Nimbus.Vfs.RevisionFloor.last_step
      - Nimbus.Vfs.RevisionFloor.steps_facts
    tsRefs:
      - packages/core/src/vfs/path-revisions.ts#PathRevisions.stamp
      - packages/core/src/vfs/path-revisions.ts#PathRevisions.dropThrough
      - packages/core/src/vfs/path-revisions.ts#PathRevisions.report
      - packages/core/src/vfs/sqlite-vfs.ts#SqliteVFS.revision
      - packages/core/src/vfs/sqlite-vfs.ts#SqliteVFS.pathRevision
      - packages/core/src/vfs/sqlite-vfs.ts#SqliteVFS.bumpRevision
      - packages/core/src/vfs/sqlite-vfs.ts#SqliteVFS.pruneTombstones
    refinement:
      - lean/fixtures/revision-floor.json :: tests/unit/revision-floor-refinement.mjs
    remainingEvidence:
      - Paths are component lists; normalizeVfsPath and a confined caller's storageKey are not modeled
      - The code's cutoff rule is exercised by the fixtures; every theorem holds for any cutoff at or below the clock
      - A bump names exactly the paths whose rows or tombstones it writes (the code's affectedPaths), each at the generation of the transaction that wrote it last; the fixtures cover one transaction, rename (two) and embedder transactions of writes and removals, not a rename's multi-group phases, copyTree slices or restore
      - A tombstone prune is a drop to the pruned edge followed by forget, and no fixture prunes one (the code keeps 65,536)
  VFS-REV-003:
    statement: The invalidation log names every path a publication mutated at the revision the path reports right after it (its stamp, else its row's generation for a file, else the later of the floor and its own generation), and the directory of each at the publication's revision, which it reports too, whatever the stamp budget drops.
    status: proved-and-refined
    theorems:
      - Nimbus.Vfs.RevisionFloor.log_eq_revision
      - Nimbus.Vfs.RevisionFloor.parent_log_eq_revision
      - Nimbus.Vfs.RevisionFloor.drops_facts
