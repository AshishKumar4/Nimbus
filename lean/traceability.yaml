# Machine-checked by check-traceability.mjs. The Lean models are maintained by
# hand; a theorem proves its statement only inside the named abstract model. A
# proved-and-refined requirement also names the fixture the model generates and
# the unit test that runs the deployed TypeScript on it (scripts/verify-lean.sh
# regenerates the fixtures and runs those tests).
edition: 1.0.0
formalScope: abstract-model-only
requirements:
  VFS-REV-001:
    statement: With stamps held only for directories (a written or removed path reports the generation of its row or tombstone) and operations of several transactions (each path at its own generation, published at the last), a path's reported revision never falls below its own last mutation nor rises above the clock, a directory never reports below any path under it, so every report of a path made before a mutation of it is below every report made after, and the floor never decreases.
    status: proved-and-refined
    theorems:
      - Nimbus.Vfs.RevisionFloor.revision_ge_last
      - Nimbus.Vfs.RevisionFloor.revision_watermark
      - Nimbus.Vfs.RevisionFloor.revision_increases_across_mutation
      - Nimbus.Vfs.RevisionFloor.revision_le_clock
      - Nimbus.Vfs.RevisionFloor.floor_monotone
