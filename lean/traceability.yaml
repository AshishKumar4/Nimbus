  N17-001:
    statement: N17 hydration in an import window, at chunk granularity, with fetch failure and reader deadlines - no reader, sync or async, is ever handed the bytes of a path with a chunk that is not local; stored chunks stay stored; every remote chunk neither stored nor failed for good stays queued through any failures, backoffs and retries; a job fetches the first queued hash whose backoff has passed, a failed hash goes to the back with an exponential backoff and after maxAttempts is failed for good and never stored; every read, waiting reader and gate of a path backed by a failed hash has EIO naming the path and chunk; no waiting reader outlives its read deadline and no open gate its launch deadline, whatever the fetches do; a sync read of a non-local path answers EIO and moves its chunks to the front; after a gate opens no sync read of a named path answers EIO; with every queued hash ready and no named chunk failed, the named paths are local after as many successful fetches as they had remote chunks.
