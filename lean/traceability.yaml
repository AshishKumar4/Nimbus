      - pin_gen is taken to equal MAX(vfs_snapshots.gen) after every transaction, as BUILD-RULES R9 states
  CS-003:
    statement: A restore job that runs to its end with no other write in between leaves every path reading exactly what the snapshot reads, across DO resets during the job.
    status: proved-and-refined
