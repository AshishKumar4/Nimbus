<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus — Cloud Dev Environment</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="/_assets/agent-chat/agent-chat.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

    /* Header */
    .header { display: flex; align-items: center; justify-content: space-between; padding: 4px 12px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; min-height: 32px; }
    .header h1 { font-size: 13px; font-weight: 600; color: #58a6ff; display: flex; gap: 8px; align-items: center; }
    .header h1 span { color: #3fb950; font-weight: 400; font-family: ui-monospace, Menlo, monospace; font-size: 11px; cursor: pointer; padding: 1px 6px; border-radius: 3px; background: #161b22; border: 1px solid #30363d; transition: background 0.15s; }
    .header h1 span:hover { background: #21262d; }
    .header h1 span.copied { color: #3fb950; background: #0f2416; border-color: #238636; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f85149; transition: background 0.3s; }
    .status-dot.connected { background: #3fb950; }
    .status-dot.connecting { background: #d29922; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* Toolbar */
    .toolbar { display: flex; align-items: center; gap: 2px; padding: 2px 8px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; }
    .toolbar button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 3px 10px; font-size: 11px; cursor: pointer; border-radius: 4px; }
    .toolbar button:hover { background: #30363d; }
    .toolbar button.active { background: #388bfd26; border-color: #58a6ff; color: #58a6ff; }
    .toolbar .sep { width: 1px; height: 16px; background: #30363d; margin: 0 4px; }
    .toolbar .vite-status { font-size: 11px; color: #8b949e; margin-left: auto; }
    .toolbar .vite-status.running { color: #3fb950; }
    /* Process count button. Sits next to the workspace buttons. Hidden
       (display:none) until at least one process has been seen in this
       session so it doesn't clutter a brand-new session's toolbar. */
    .toolbar #btnProcs { display: none; gap: 6px; align-items: center; font-family: ui-monospace, Menlo, monospace; }
    .toolbar #btnProcs.visible { display: inline-flex; }
    .toolbar #btnProcs.has-running { border-color: #3fb950; color: #3fb950; }
    .toolbar #btnProcs.active { background: #388bfd26; border-color: #58a6ff; color: #58a6ff; }
    .toolbar #btnProcs .procs-dot { width: 6px; height: 6px; border-radius: 50%; background: #6e7681; display: inline-block; }
    .toolbar #btnProcs.has-running .procs-dot { background: #3fb950; box-shadow: 0 0 4px #3fb950; animation: pulse 1.6s ease-in-out infinite; }

    /* Main panel */
    .main { flex: 1; display: flex; overflow: hidden; }

    /* Terminal panel — VS Code terminal-panel model. The view area
       (.term-main) shows the main shell xterm OR one process view at a
       time, full height; the process sidebar on the right lists the
       shell + every process. */
    .panel-terminal { flex: 1; display: flex; overflow: hidden; min-width: 0; min-height: 0; }
    .term-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
    #terminal-container { flex: 1; padding: 4px; overflow: hidden; min-height: 0; }
    .term-main.proc-view #terminal-container { display: none; }
    .logs-panel-body { display: none; flex: 1; overflow: auto; background: #0d1117; position: relative; min-height: 0; }
    .term-main.proc-view .logs-panel-body { display: block; }

    /* Process sidebar. Chrome surface (#161b22) like the toolbar/header;
       hidden until the first process is seen, collapsible via the head
       chevron or the toolbar Processes button. */
    .proc-sidebar { display: none; flex-direction: column; width: 200px; flex-shrink: 0; background: #161b22; border-left: 1px solid #30363d; overflow: hidden; }
    .proc-sidebar.active { display: flex; }
    .proc-sidebar-head { display: flex; align-items: center; gap: 4px; padding: 4px 6px 4px 10px; min-height: 28px; border-bottom: 1px solid #30363d; flex-shrink: 0; }
    .proc-sidebar-title { flex: 1; font-size: 11px; color: #8b949e; text-transform: uppercase; letter-spacing: 0.5px; font-family: ui-monospace, Menlo, monospace; }
    .proc-sidebar-head button { background: transparent; border: 1px solid transparent; color: #8b949e; padding: 2px 6px; font-size: 12px; cursor: pointer; border-radius: 3px; line-height: 1; }
    .proc-sidebar-head button:hover { background: #30363d; color: #c9d1d9; }
    .proc-list { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 4px 0; }
    .proc-list::-webkit-scrollbar { width: 8px; }
    .proc-list::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    .proc-item { display: flex; align-items: center; gap: 7px; padding: 4px 8px 4px 10px; font-family: ui-monospace, Menlo, monospace; font-size: 11px; line-height: 18px; color: #8b949e; cursor: pointer; user-select: none; white-space: nowrap; min-width: 0; border-left: 2px solid transparent; }
    .proc-item:hover { background: #21262d; color: #c9d1d9; }
    .proc-item.active { background: #1f6feb2b; color: #e6edf3; border-left-color: #58a6ff; }
    .proc-item.exited { color: #6e7681; }
    .proc-item.exited.failed { color: #ff7b72; }
    .proc-item .proc-icon { color: #58a6ff; font-weight: 600; flex-shrink: 0; }
    .proc-item .proc-dot { width: 6px; height: 6px; border-radius: 50%; background: #3fb950; box-shadow: 0 0 4px #3fb950; flex-shrink: 0; }
    .proc-item.exited .proc-dot { background: #6e7681; box-shadow: none; }
    .proc-item.exited.failed .proc-dot { background: #ff7b72; }
    .proc-item .proc-label { flex: 1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .proc-item .proc-pid { color: #484f58; flex-shrink: 0; }
    /* Hover swaps the dim pid for the action cluster (VS Code style). */
    .proc-item .proc-actions { display: none; align-items: center; gap: 2px; flex-shrink: 0; }
    .proc-item:hover .proc-actions { display: flex; }
    .proc-item:hover .proc-pid { display: none; }
    .proc-item .proc-act { color: #6e7681; font-size: 11px; line-height: 1.4; padding: 0 3px; border-radius: 2px; cursor: pointer; user-select: none; }
    .proc-item .proc-act:hover { color: #c9d1d9; background: #30363d; }
    .proc-item .proc-act.proc-act-kill:hover, .proc-item .proc-act.proc-act-close:hover { color: #f85149; }
    .proc-item .proc-act.proc-act-close { font-size: 13px; }
    .proc-item.exited .proc-act-kill, .proc-item.exited .proc-act-restart { display: none; }
    /* New spawns announce themselves with a brief flash — no focus steal. */
    @keyframes procItemFlash { from { background: #388bfd33; } to { background: transparent; } }
    .proc-item.fresh { animation: procItemFlash 1.4s ease-out; }
    @media (max-width: 1100px) { .proc-sidebar { width: 156px; } }
    .logs-view { display: none; white-space: pre; font-family: 'JetBrains Mono', 'Fira Code', Menlo, monospace; font-size: 12px; line-height: 1.5; color: #c9d1d9; padding: 8px 10px; word-break: break-all; min-height: 100%; }
    .logs-view.active { display: block; }
    .logs-view.terminal-view { padding: 0; white-space: normal; overflow: hidden; }
    .logs-view.terminal-view .xterm { height: 100%; padding: 6px 8px; }
    .logs-view .stderr { color: #ff7b72; }
    .logs-view .binary { color: #8b949e; font-style: italic; }
    .logs-view .banner { display: block; color: #d29922; background: #221a00; border-left: 2px solid #d29922; padding: 4px 8px; margin: 6px 0; font-family: inherit; }
    .logs-view .banner.ok { color: #3fb950; background: #0f2416; border-left-color: #3fb950; }
    .logs-view .banner.failed { color: #ff7b72; background: #2d0d0c; border-left-color: #ff7b72; }

    /* Resize handle */
    .resize-handle { width: 4px; background: #30363d; cursor: col-resize; flex-shrink: 0; }
    .resize-handle:hover { background: #58a6ff; }
    /* Vertical resize handle for editor (top) ↔
       terminal (bottom) inside the editor-stack column. Hidden outside
       editor mode (rule under .main.editor below). */
    .vresize-handle {
      display: none; height: 4px; background: #30363d;
      cursor: row-resize; flex-shrink: 0;
    }
    .vresize-handle:hover { background: #58a6ff; }

    /* Preview panel */
    .panel-preview { flex: 1; display: flex; flex-direction: column; background: #0d1117; overflow: hidden; min-width: 0; }
    .panel-preview.hidden { display: none; }
    .preview-bar { display: flex; align-items: center; gap: 6px; padding: 3px 8px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; min-width: 0; }
    .preview-tabs {
      display: flex; align-items: center; gap: 3px; min-width: 110px; max-width: 45%;
      overflow-x: auto; scrollbar-width: none; flex: 0 1 auto;
    }
    .preview-tabs::-webkit-scrollbar { display: none; }
    .preview-bar .preview-tab {
      height: 22px; display: inline-flex; align-items: center; gap: 5px; min-width: 0;
      max-width: 150px; padding: 0 8px; border-radius: 4px 4px 0 0;
      border: 1px solid transparent; border-bottom-color: transparent;
      background: transparent; color: #8b949e; font-size: 11px; line-height: 1;
      white-space: nowrap; cursor: pointer;
    }
    .preview-bar .preview-tab:hover { background: #21262d; color: #c9d1d9; }
    .preview-bar .preview-tab.active {
      background: #0d1117; color: #f0f6fc; border-color: #30363d;
      border-bottom-color: #0d1117;
    }
    .preview-bar .preview-tab.running::before {
      content: ""; width: 6px; height: 6px; border-radius: 999px;
      background: #3fb950; box-shadow: 0 0 8px rgba(63,185,80,0.55);
      flex: 0 0 auto;
    }
    .preview-bar .preview-tab.markdown::before {
      content: "md"; color: #79c0ff; font: 9px/1 ui-monospace, Menlo, monospace;
      border: 1px solid rgba(121,192,255,0.35); border-radius: 3px; padding: 1px 2px;
      flex: 0 0 auto;
    }
    .preview-tab-label { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
    .preview-bar .url-bar { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #c9d1d9; padding: 2px 8px; font-size: 11px; border-radius: 4px; font-family: monospace; }
    .preview-bar button { background: none; border: none; color: #8b949e; cursor: pointer; font-size: 14px; padding: 2px 4px; }
    .preview-bar button:hover { color: #c9d1d9; }
    #preview-frame { flex: 1; border: none; background: white; width: 100%; }
    #markdown-preview {
      display: none; flex: 1; min-height: 0; overflow: auto;
      background: #0d1117; color: #c9d1d9;
    }
    #markdown-preview.active { display: block; }
    .markdown-body {
      max-width: 860px; margin: 0 auto; padding: 34px 44px 56px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 14px; line-height: 1.65;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      color: #f0f6fc; line-height: 1.25; margin: 24px 0 12px;
      border-bottom: 1px solid #30363d; padding-bottom: 8px;
    }
    .markdown-body h1 { font-size: 30px; margin-top: 0; }
    .markdown-body h2 { font-size: 22px; }
    .markdown-body h3 { font-size: 18px; border-bottom: 0; padding-bottom: 0; }
    .markdown-body p, .markdown-body ul, .markdown-body ol, .markdown-body table,
    .markdown-body blockquote { margin: 0 0 16px; }
    .markdown-body a { color: #58a6ff; text-decoration: none; }
    .markdown-body a:hover { text-decoration: underline; }
    .markdown-body code {
      background: rgba(110, 118, 129, 0.28); color: #f0f6fc;
      border-radius: 4px; padding: 0.15em 0.35em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.92em;
    }
    /* Fenced code renders as .code-block cards from the shared island
       pipeline (agent-chat.css owns their look). Raw-HTML <pre> in the
       markdown keeps the plain document treatment. */
    .markdown-body .code-block { margin: 0 0 16px; }
    .markdown-body pre:not(.code-block pre) {
      background: #161b22; border: 1px solid #30363d; border-radius: 6px;
      padding: 14px 16px; overflow: auto; margin: 0 0 16px;
    }
    .markdown-body pre:not(.code-block pre) code { background: transparent; padding: 0; color: #c9d1d9; }
    .markdown-body blockquote {
      border-left: 3px solid #3fb950; color: #8b949e; padding: 4px 0 4px 14px;
    }
    .markdown-body table { border-collapse: collapse; width: 100%; display: block; overflow: auto; }
    .markdown-body th, .markdown-body td {
      border: 1px solid #30363d; padding: 7px 10px; text-align: left;
    }
    .markdown-body th { background: #161b22; color: #f0f6fc; }
    .markdown-body tr:nth-child(2n) td { background: rgba(22, 27, 34, 0.5); }
    .markdown-body hr { border: 0; border-top: 1px solid #30363d; margin: 24px 0; }

    /* Footer */
    .footer { padding: 3px 12px; background: #161b22; border-top: 1px solid #30363d; font-size: 11px; color: #8b949e; flex-shrink: 0; display: flex; justify-content: space-between; gap: 12px; }
    .footer .stats { display: flex; gap: 10px; flex-wrap: wrap; }
    .footer .stat-label { color: #484f58; }
    .footer .stat-value { color: #c9d1d9; }
    .footer .stat-value.good { color: #3fb950; }

    /* Agent chat — #agentPanel is a mount node for the built chat island
       (/_assets/agent-chat/). The island ships its own markup and styles;
       the shell owns only the panel's place in the workspace layout. */
    .panel-agent {
      display: none; flex: 1; min-width: 0; min-height: 0;
      flex-direction: column;
    }
    /* Editor workspace:
         FILE TREE | editor-stack (editor TOP + terminal BOTTOM) | PREVIEW

       Editor, Agent, and terminal live inside .panel-left-stack. The top
       surface switches between the editor and chat while the terminal and
       preview stay visible. */

    /* Editor panel — hidden by default; shown by workspace rules. */
    .panel-editor {
      flex: 1; display: none; flex-direction: column;
      background: #1e1e1e;        /* VSCode dark editor background */
      overflow: hidden; min-width: 0; min-height: 0;
    }
    .panel-editor.active { display: flex; }

    /* Wrapper for the center workspace column. */
    .panel-left-stack { display: contents; }

    /* File-tree sidebar. Lives as a FIRST child of
       .main; visible in the editor workspace. ~250px default width,
       resizable via .tree-resize-handle. */
    .panel-tree {
      display: none; flex-direction: column;
      width: 250px; min-width: 160px; max-width: 600px;
      background: #181818;        /* slightly darker than editor bg */
      border-right: 1px solid #30363d;
      flex-shrink: 0;
      overflow: hidden;
    }
    .tree-resize-handle {
      display: none;
      width: 4px; background: #30363d; cursor: col-resize; flex-shrink: 0;
    }
    .tree-resize-handle:hover { background: #58a6ff; }

    .tree-toolbar {
      display: flex; align-items: center; gap: 4px;
      padding: 4px 6px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
      flex-shrink: 0;
      min-height: 28px;
    }
    .tree-toolbar .tree-title {
      flex: 1;
      font-size: 11px; color: #8b949e; text-transform: uppercase;
      letter-spacing: 0.5px; font-family: ui-monospace, Menlo, monospace;
      padding-left: 4px;
    }
    .tree-toolbar button {
      background: transparent; border: 1px solid transparent;
      color: #8b949e; padding: 2px 6px; font-size: 14px;
      cursor: pointer; border-radius: 3px; line-height: 1;
    }
    .tree-toolbar button:hover { background: #30363d; color: #c9d1d9; }

    .tree-search-wrap {
      padding: 4px 6px; background: #161b22;
      border-bottom: 1px solid #30363d; flex-shrink: 0;
    }
    .tree-search {
      width: 100%;
      background: #0d1117; border: 1px solid #30363d; color: #c9d1d9;
      padding: 3px 6px; font-size: 11px; border-radius: 3px;
      font-family: ui-monospace, Menlo, monospace; outline: none;
    }
    .tree-search:focus { border-color: #58a6ff; }

    .tree-body {
      flex: 1; overflow: auto; padding: 4px 0;
      font-family: ui-monospace, Menlo, monospace; font-size: 12px;
      color: #c9d1d9;
    }
    .tree-body::-webkit-scrollbar { width: 8px; }
    .tree-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
    .tree-body::-webkit-scrollbar-thumb:hover { background: #484f58; }

    /* Tree nodes — each row has its own indent calculated via padding-left.
       Hover + selected states match VSCode dark. */
    .tree-node {
      display: flex; align-items: center; gap: 4px;
      padding: 2px 8px 2px 4px;
      cursor: pointer; user-select: none;
      white-space: nowrap; overflow: hidden;
      line-height: 20px;
    }
    .tree-node:hover { background: #21262d; }
    .tree-node.selected { background: #1f6feb44; color: #58a6ff; }
    .tree-node.hidden { display: none; }
    .tree-node .tree-chevron {
      width: 12px; flex-shrink: 0; color: #6e7681;
      font-size: 9px; text-align: center;
      transition: transform 0.15s;
    }
    .tree-node.dir > .tree-chevron { color: #c9d1d9; }
    .tree-node.dir.expanded > .tree-chevron { transform: rotate(90deg); }
    .tree-node.file > .tree-chevron { visibility: hidden; }
    .tree-node .tree-icon { width: 14px; flex-shrink: 0; text-align: center; }
    .tree-node .tree-label { overflow: hidden; text-overflow: ellipsis; }
    .tree-node.dirty .tree-label::after { content: ' ●'; color: #d29922; }
    .tree-children { /* unused; tree is flat with calculated indent */ }
    .tree-empty {
      padding: 16px 12px; color: #6e7681; font-style: italic;
      font-size: 11px; text-align: center;
    }

    /* Editor layout: file tree | editor-stack | preview */
    .main.editor .panel-tree { display: flex; }
    .main.editor .tree-resize-handle { display: block; }
    .main.editor .panel-left-stack {
      display: flex; flex: 1; flex-direction: column;
      min-width: 0; min-height: 0; overflow: hidden;
    }
    .main.editor .panel-editor {
      display: flex; flex: 1 1 60%; min-height: 100px;
    }
    .main.editor .panel-terminal {
      display: flex; flex: 0 0 40%; min-height: 80px;
    }
    .main.editor .panel-agent { display: none; }
    .main.editor .panel-left-stack.agent-surface .panel-editor { display: none; }
    .main.editor .panel-left-stack.agent-surface .panel-agent {
      display: flex; flex: 1 1 60%; min-height: 100px;
    }
    .main.editor .vresize-handle { display: block; }
    .main.editor .resize-handle { display: block; }
    .main.editor .panel-preview { display: flex; flex: 1; min-width: 0; }

    /* VSCode-like editor statusbar (bottom-of-editor bar with
       line:col, language, encoding). */
    .editor-statusbar {
      display: flex; align-items: center; gap: 8px;
      padding: 2px 12px;
      background: #007acc;        /* VSCode blue */
      color: #ffffff;
      font-family: ui-monospace, Menlo, monospace;
      font-size: 11px;
      flex-shrink: 0;
      min-height: 20px;
    }
    .editor-statusbar .sep { color: rgba(255,255,255,0.5); }
    .editor-bar { display: flex; align-items: center; gap: 6px; padding: 3px 8px; background: #161b22; border-bottom: 1px solid #30363d; flex-shrink: 0; font-size: 11px; color: #8b949e; min-height: 24px; }
    .editor-bar .editor-tab { padding: 2px 8px; background: #21262d; border: 1px solid #30363d; border-radius: 3px; color: #c9d1d9; font-family: ui-monospace, Menlo, monospace; font-size: 11px; display: flex; align-items: center; gap: 6px; }
    .editor-bar .editor-tab.dirty::after { content: '●'; color: #d29922; font-size: 10px; }
    .editor-bar .editor-tab-empty { color: #6e7681; font-style: italic; }
    .editor-bar .editor-hint { margin-left: auto; color: #6e7681; font-family: ui-monospace, Menlo, monospace; }
    #monaco-container { flex: 1; min-height: 0; min-width: 0; }
    .editor-placeholder { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: #8b949e; font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: 24px; text-align: center; }
    .editor-placeholder .key { background: #21262d; border: 1px solid #30363d; padding: 1px 6px; border-radius: 3px; color: #c9d1d9; font-size: 11px; }

    /* Command palette (Ctrl+P) */
    .palette-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.4); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding-top: 80px; }
    .palette-overlay.active { display: flex; }
    .palette-box { background: #161b22; border: 1px solid #30363d; border-radius: 6px; width: 520px; max-width: 90vw; max-height: 60vh; display: flex; flex-direction: column; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
    .palette-input { background: #0d1117; border: none; border-bottom: 1px solid #30363d; color: #c9d1d9; padding: 10px 14px; font-size: 13px; outline: none; font-family: ui-monospace, Menlo, monospace; border-radius: 6px 6px 0 0; }
    .palette-list { overflow-y: auto; max-height: 400px; }
    .palette-item { padding: 6px 14px; color: #c9d1d9; font-family: ui-monospace, Menlo, monospace; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .palette-item.active { background: #1f6feb44; color: #58a6ff; }
    .palette-item:hover { background: #21262d; }
    .palette-empty { padding: 14px; color: #6e7681; font-style: italic; font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <h1>
      <a href="/" style="color:inherit;text-decoration:none">Nimbus</a>
      <span id="sessionLabel" title="Session ID (shareable) — click to copy URL"></span>
    </h1>
    <div class="status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Disconnected</span>
    </div>
  </div>
  <div class="toolbar" id="toolbar">
    <!-- Single workspace: file tree | editor/agent + terminal | preview. -->
    <button id="btnEditor" class="active" title="Editor">Editor</button>
    <button id="btnAgent" title="Agent chat">Agent</button>
    <div class="sep"></div>
    <button id="btnProcs" title="Toggle the process sidebar">
      <span class="procs-dot"></span>
      <span>Processes</span>
      <span id="procsCount" style="color:#8b949e">0</span>
    </button>
    <button id="btnRefresh" title="Reload preview">&#8635;</button>
    <span class="vite-status" id="viteStatus"></span>
  </div>
  <div class="main" id="mainPanel">
    <!-- File-tree sidebar. Visible in the workspace.
         The .tree-resize-handle sits between tree and the center stack;
         dragging it adjusts .panel-tree's width inline. -->
    <div class="panel-tree" id="treePanel">
      <div class="tree-toolbar">
        <span class="tree-title">Explorer</span>
        <button id="btnTreeNewFile" title="New File">＋</button>
        <button id="btnTreeNewDir" title="New Folder">📁</button>
        <button id="btnTreeRefresh" title="Refresh tree (re-fetch root)">⟳</button>
      </div>
      <div class="tree-search-wrap">
        <input id="treeSearch" class="tree-search" placeholder="Filter files…" autocomplete="off" spellcheck="false">
      </div>
      <div class="tree-body" id="treeBody"></div>
    </div>
    <div class="tree-resize-handle" id="treeResizeHandle"></div>
    <!-- The .panel-left-stack wrapper is the middle workspace column. -->
    <div class="panel-left-stack" id="leftStack">
      <div class="panel-editor" id="editorPanel">
        <div class="editor-bar">
          <div class="editor-tab editor-tab-empty" id="editorTab">no file</div>
          <span class="editor-hint">
            <kbd>Ctrl+P</kbd> open file &nbsp;·&nbsp; <kbd>Ctrl+S</kbd> save
          </span>
          <span class="editor-status" id="editorStatus" style="margin-left:8px;color:#6e7681;font-family:ui-monospace,Menlo,monospace;font-size:10px"></span>
        </div>
        <div class="editor-placeholder" id="editorPlaceholder">
          <div>Press <span class="key">Ctrl</span>+<span class="key">P</span> to open a file.</div>
          <div style="font-size:11px;color:#6e7681">Monaco loads on demand.</div>
        </div>
        <div id="monaco-container" style="display:none"></div>
        <div class="editor-statusbar" id="editorStatusBar">
          <span id="editorStatusPos">—</span>
          <span class="sep">·</span>
          <span id="editorStatusLang">plaintext</span>
          <span class="sep">·</span>
          <span id="editorStatusEnc">UTF-8</span>
        </div>
      </div>
      <!-- Mount node for the built agent-chat island (loaded on demand). -->
      <div class="panel-agent" id="agentPanel"></div>
      <!-- Vertical resize handle between the top surface and terminal. -->
      <div class="vresize-handle" id="editorTerminalResizeHandle"></div>
      <div class="panel-terminal">
        <div class="term-main" id="termMain">
          <div id="terminal-container"></div>
          <div class="logs-panel-body" id="logsPanelBody"></div>
        </div>
        <div class="proc-sidebar" id="procSidebar">
          <div class="proc-sidebar-head">
            <span class="proc-sidebar-title">Processes</span>
            <button id="btnProcSidebarHide" title="Hide sidebar (reopen via the Processes button)">&raquo;</button>
          </div>
          <div class="proc-list" id="procList">
            <div class="proc-item shell active" id="procShellItem" title="Main terminal — the session shell">
              <span class="proc-icon">&#10095;_</span>
              <span class="proc-label">shell</span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="resize-handle" id="resizeHandle"></div>
    <div class="panel-preview" id="previewPanel">
      <div class="preview-bar">
        <div class="preview-tabs" id="previewTabs" aria-label="Preview tabs"></div>
        <input class="url-bar" id="urlBar" value="" readonly>
        <button id="btnReloadPreview" title="Reload">&#8635;</button>
      </div>
      <iframe id="preview-frame" src="about:blank"></iframe>
      <div id="markdown-preview" aria-label="Markdown preview">
        <article class="markdown-body" id="markdown-preview-body"></article>
      </div>
    </div>
  </div>
  <!-- Ctrl+P command palette. Lazy-populated fuzzy file finder; fs-list
       is sent on first open per editor session. -->
  <div class="palette-overlay" id="paletteOverlay">
    <div class="palette-box">
      <input class="palette-input" id="paletteInput" placeholder="Type a file name…" autocomplete="off" spellcheck="false">
      <div class="palette-list" id="paletteList"></div>
    </div>
  </div>
  <div class="footer">
    <div class="stats" id="statsBar">
      <span><span class="stat-label">FS:</span> <span class="stat-value" id="stFiles">-</span></span>
      <span><span class="stat-label">Size:</span> <span class="stat-value" id="stSize">-</span></span>
      <span><span class="stat-label">Cache:</span> <span class="stat-value" id="stCache">-</span></span>
      <span><span class="stat-label">Hit:</span> <span class="stat-value good" id="stHitRate">-</span></span>
    </div>
    <span style="color:#484f58">DO + SQLite demand-paged | esbuild-wasm | vite dev server</span>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/lib/addon-webgl.min.js"></script>
  <script>
    // ── Session-aware URL helpers ──
    // This page is served at /s/<id>/ via the asset binding. All DO-bound
    // paths (/ws, /api/*, /preview/*) live under the same session prefix.
    // Compute once at load time — location.pathname won't change.
    const SESSION_PREFIX = (function() {
      const parts = location.pathname.split('/').filter(Boolean);
      const candidate = parts[0] === 's' ? parts[1] : '';
      return isNimbusSessionId(candidate) ? '/s/' + candidate : '';
    })();
    const SESSION_ID = SESSION_PREFIX.startsWith('/s/') ? SESSION_PREFIX.slice(3) : '';
    function isNimbusSessionId(value) {
      if (!value) return false;
      const parts = String(value).split('-');
      return parts.length === 3 &&
        isLowerWord(parts[0], 3, 14) &&
        isLowerWord(parts[1], 3, 14) &&
        parts[2].length === 4 &&
        Array.from(parts[2]).every((ch) => ch >= '0' && ch <= '9');
    }
    function isLowerWord(value, min, max) {
      if (!value || value.length < min || value.length > max) return false;
      return Array.from(value).every((ch) => ch >= 'a' && ch <= 'z');
    }
    const WS_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') +
                   '//' + location.host + SESSION_PREFIX + '/ws';
    const STATS_URL = SESSION_PREFIX + '/api/stats';
    const VITE_URL = SESSION_PREFIX + '/preview/';
    const WORKER_URL = SESSION_PREFIX + '/worker/';
    // The iframe starts pointing at /preview/ which handles its own
    // "no dev server running" placeholder. When the user spawns a
    // wrangler dev (via `wrangler dev` in the terminal), stats polling
    // below flips this to WORKER_URL automatically.
    const PREVIEW_URL = VITE_URL;
    let nimbusReadyPosted = false;
    let nimbusDisconnectErrorTimer = null;
    function postNimbusEvent(type, payload) {
      if (window.parent === window) return;
      try { window.parent.postMessage(Object.assign({ type }, payload || {}), '*'); } catch {}
    }
    function postNimbusReady() {
      if (nimbusReadyPosted) return;
      nimbusReadyPosted = true;
      postNimbusEvent('nimbus:ready', { sessionId: SESSION_ID });
    }
    function clearNimbusDisconnectError() {
      if (!nimbusDisconnectErrorTimer) return;
      clearTimeout(nimbusDisconnectErrorTimer);
      nimbusDisconnectErrorTimer = null;
    }
    function scheduleNimbusDisconnectError() {
      if (nimbusDisconnectErrorTimer) return;
      nimbusDisconnectErrorTimer = setTimeout(() => {
        nimbusDisconnectErrorTimer = null;
        postNimbusEvent('nimbus:error', {
          code: 'E_WS_CLOSED',
          message: 'Nimbus shell WebSocket remained disconnected for 30 seconds.',
        });
      }, 30_000);
    }

    // Populate the URL bar with the full session preview URL so users can
    // copy-paste it (e.g. to share just the preview with a teammate).
    // The value is kept in sync with the iframe by applyPreviewTarget().
    document.getElementById('urlBar').value = PREVIEW_URL;

    // Update document title to include the session ID — makes tabs easy to
    // distinguish when a user has multiple Nimbus sessions open.
    // Also populate the session-label chip in the header; clicking it copies
    // the full session URL to the clipboard for easy sharing.
    if (SESSION_PREFIX) {
      const sessionId = SESSION_PREFIX.slice(3); // strip "/s/"
      document.title = 'Nimbus — ' + sessionId;
      const chip = document.getElementById('sessionLabel');
      if (chip) {
        chip.textContent = sessionId;
        chip.addEventListener('click', async () => {
          const shareUrl = location.origin + SESSION_PREFIX + '/';
          try {
            await navigator.clipboard.writeText(shareUrl);
            const original = chip.textContent;
            chip.textContent = 'copied!';
            chip.classList.add('copied');
            setTimeout(() => { chip.textContent = original; chip.classList.remove('copied'); }, 1200);
          } catch { /* clipboard API unavailable — silently ignore */ }
        });
      }
    }

    // ── Terminal setup ──
    const term = new Terminal({
      cursorBlink: true, cursorStyle: 'bar', fontSize: 13,
      fontFamily: "'JetBrains Mono', 'Fira Code', Menlo, monospace",
      theme: {
        background: '#0d1117', foreground: '#c9d1d9', cursor: '#58a6ff', selectionBackground: '#264f78',
        black: '#484f58', red: '#ff7b72', green: '#3fb950', yellow: '#d29922',
        blue: '#58a6ff', magenta: '#bc8cff', cyan: '#39d353', white: '#c9d1d9',
        brightBlack: '#6e7681', brightRed: '#ffa198', brightGreen: '#56d364', brightYellow: '#e3b341',
        brightBlue: '#79c0ff', brightMagenta: '#d2a8ff', brightCyan: '#56d364', brightWhite: '#f0f6fc',
      },
      allowProposedApi: true,
      // macOS Option key emits Meta-prefixed sequences (\x1b<letter>),
      // matching Linux Alt behaviour. Without this, Option+B/F/D on
      // Mac silently inserts unicode `∫ƒ∂` glyphs instead of triggering
      // word-by-word readline edits. xterm.js default is false; bash /
      // Terminal.app / iTerm2 default this to true via their own
      // "Use Option as Meta" preference. We hard-set true so Mac users
      // get Linux-parity readline keybindings out of the box.
      macOptionIsMeta: true,
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    try { term.loadAddon(new WebglAddon.WebglAddon()); } catch (e) {}
    term.open(document.getElementById('terminal-container'));
    fitAddon.fit();

    // ── State ──
    const dot = document.getElementById('statusDot');
    const stText = document.getElementById('statusText');
    const previewFrame = document.getElementById('preview-frame');
    const previewPanel = document.getElementById('previewPanel');
    const previewTabsEl = document.getElementById('previewTabs');
    const markdownPreview = document.getElementById('markdown-preview');
    const markdownPreviewBody = document.getElementById('markdown-preview-body');
    const mainPanel = document.getElementById('mainPanel');
    const viteStatus = document.getElementById('viteStatus');
    let ws = null, rd = 1000, statsTimer = null;
    // The app has one workspace layout. Only the top center surface switches.
    let layout = 'editor';
    let workSurface = 'editor';

    // ── Agent chat island + markdown pipeline ──
    // The built island bundle (Preact chat app + marked/DOMPurify/
    // highlight.js) is dynamic-imported on first use: the Agent surface
    // mounts the chat, and the markdown preview pane shares its
    // renderMarkdown pipeline. One module, one renderer.
    let agentChatModulePromise = null;
    let agentChatRetries = 0;
    function ensureAgentChat() {
      if (!agentChatModulePromise) {
        // A failed load (offline, transient 5xx) must not stick forever.
        // Browsers cache FAILED module fetches in the page's module map,
        // so a retry has to bust the URL, not just re-import it.
        const url = '/_assets/agent-chat/agent-chat.js'
          + (agentChatRetries > 0 ? '?retry=' + agentChatRetries : '');
        agentChatModulePromise = import(url);
        agentChatModulePromise.catch(() => {
          agentChatRetries++;
          agentChatModulePromise = null;
        });
      }
      return agentChatModulePromise;
    }

    // ── Layout controls ──
    function setLayout(mode) {
      workSurface = mode === 'agent' ? 'agent' : 'editor';
      layout = 'editor';
      mainPanel.className = 'main editor';
      const leftStack = document.getElementById('leftStack');
      leftStack.classList.toggle('agent-surface', workSurface === 'agent');
      document.getElementById('btnEditor').classList.toggle('active', workSurface === 'editor');
      document.getElementById('btnAgent').classList.toggle('active', workSurface === 'agent');
      // Editor panel visibility — drives display:flex via .active unless
      // the agent surface is currently selected.
      const editorPanel = document.getElementById('editorPanel');
      const wantEditor = (workSurface === 'editor');
      editorPanel.classList.toggle('active', wantEditor);
      FileTree.ensureLoaded().catch(() => {});
      // Lazy-init Monaco the first time the editor surface is selected.
      if (wantEditor) {
        Editor.ensureLoaded()
          .then(() => Editor.openDefaultWelcome())
          .catch(() => {});
      }
      if (workSurface === 'agent') {
        ensureAgentChat().then((island) => island.ensureLoaded()).catch((e) => {
          const panel = document.getElementById('agentPanel');
          if (panel && !panel.querySelector('.agent-chat')) {
            panel.textContent = 'Agent chat failed to load: ' + (e?.message || e);
          }
        });
      }
      setTimeout(() => {
        // Re-apply persisted pane dims for this workspace.
        try { if (typeof PaneResizer !== 'undefined') PaneResizer.onLayoutChange(); } catch {}
        try { fitAddon.fit(); } catch {}
        // Re-layout Monaco after the panel resizes. automaticLayout:true
        // already handles this but explicit layout() on surface switch
        // avoids a one-frame flash where the editor sees its old size.
        if (window.__nimbusMonacoEditor) {
          try { window.__nimbusMonacoEditor.layout(); } catch {}
        }
      }, 50);
    }
    document.getElementById('btnEditor').onclick = () => setLayout('editor');
    document.getElementById('btnAgent').onclick = () => setLayout('agent');
    document.getElementById('btnRefresh').onclick = () => reloadPreview();
    document.getElementById('btnReloadPreview').onclick = () => reloadPreview();

    // ── Editor module ──
    //
    // Lazy-loads Monaco via cdnjs UMD on first call to ensureLoaded().
    //
    // Owns the open file, dirty state, Ctrl+P palette, Ctrl+S save.
    // All fs operations route through the live WS via fs-read /
    // fs-write / fs-list messages → init.ts handler → SqliteVFS.
    //
    // Perf-invariant: Monaco is loaded by runtime appending, not by an eager
    // <script src> in the served HTML.
    const Editor = (function() {
      // CDN choice: cdnjs hosts Monaco's UMD AMD-loader (`loader.min.js`)
      // which fetches the remaining vs/* chunks on demand. Total cold
      // download is ~2 MB for the editor + lazy languages. Pinned to
      // 0.52.0 (latest as of 2025-Q1) — same major as VSCode 1.95+.
      const MONACO_VERSION = '0.52.0';
      const MONACO_BASE = 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/' + MONACO_VERSION + '/min';
      let loaded = false;
      let loading = null;
      // Cached fs-list result from a previous Ctrl+P (5s TTL).
      let fileListCache = null;
      let fileListCachedAt = 0;
      // Pending fs-read / fs-write / fs-list resolves keyed by op id.
      // The terminal WS multiplexes; we tag each message with a `reqId`
      // so concurrent reads (e.g. preview tab + palette refresh) don't
      // race on the same path.
      const pending = new Map();
      let nextReqId = 1;
      const DEFAULT_WELCOME_PATH = '/home/user/welcome.md';

      // Current open file state.
      let openPath = null;        // POSIX absolute path or null
      let originalContent = '';   // last-saved content (for dirty check)
      let editor = null;          // Monaco editor instance
      let markdownUpdateTimer = null;

      function tabEl() { return document.getElementById('editorTab'); }
      function setTabFile(path, dirty) {
        const el = tabEl();
        if (!path) {
          el.textContent = 'no file';
          el.classList.add('editor-tab-empty');
          el.classList.remove('dirty');
          return;
        }
        // Show just the basename in the tab for clarity; full path in
        // the title attribute.
        const base = path.split('/').pop() || path;
        el.textContent = base;
        el.title = path;
        el.classList.remove('editor-tab-empty');
        el.classList.toggle('dirty', !!dirty);
      }

      // Send a fs-* message and await the paired result. Frames created
      // before ws.onopen are registered in pendingReqs first, then queued
      // for the open handler to drain, so callers always get the same
      // promise lifecycle.
      const outQueue = [];
      function fsRequest(frame, resultType) {
        const reqId = nextReqId++;
        frame.reqId = reqId;
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => {
            if (pending.has(reqId)) {
              pending.delete(reqId);
              reject(new Error('fs request timed out'));
            }
          }, 15000);
          pending.set(reqId, { resolve, reject, t, resultType });
          // Try to send now if the WS is OPEN; otherwise queue.
          if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify(frame)); }
            catch (e) {
              // OPEN but send threw — surface the failure immediately.
              clearTimeout(t); pending.delete(reqId); reject(e);
            }
          } else {
            outQueue.push(frame);
          }
        });
      }
      // Drain the outbound queue. Called from ws.onopen. Idempotent
      // (safe to call multiple times — empty queue is a no-op).
      // Resilient to reconnects: queue accumulates while ws.readyState
      // is CONNECTING/CLOSED and flushes on next onopen.
      function drainFsQueue() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const drained = outQueue.splice(0);
        for (const frame of drained) {
          try { ws.send(JSON.stringify(frame)); }
          catch (e) {
            // Send failed on a drained frame — reject the pending entry.
            const slot = pending.get(frame.reqId);
            if (slot) {
              pending.delete(frame.reqId);
              clearTimeout(slot.t);
              slot.reject(e);
            }
          }
        }
      }
      // Hook into the main WS onmessage to deliver fs-*-result frames.
      // Called by connect() right after parsing each incoming message —
      // returns true to indicate the message was handled here (and the
      // shell-side dispatch should skip it).
      function tryHandleFsResult(msg) {
        if (!msg || typeof msg.type !== 'string') return false;
        if (!msg.type.endsWith('-result')) return false;
        const reqId = msg.reqId;
        if (typeof reqId !== 'number') return false;
        const slot = pending.get(reqId);
        if (!slot) return false;
        pending.delete(reqId);
        clearTimeout(slot.t);
        slot.resolve(msg);
        return true;
      }

      // Detect language from extension. Monaco built-ins cover most.
      function languageFor(path) {
        const m = /\.([^.]+)$/.exec(path || '');
        const ext = m ? m[1].toLowerCase() : '';
        const map = {
          js: 'javascript', mjs: 'javascript', cjs: 'javascript',
          ts: 'typescript', tsx: 'typescript', jsx: 'javascript',
          py: 'python', rb: 'ruby', go: 'go', rs: 'rust',
          c: 'c', h: 'c', cpp: 'cpp', cc: 'cpp', hpp: 'cpp',
          java: 'java', kt: 'kotlin', swift: 'swift',
          json: 'json', yaml: 'yaml', yml: 'yaml', toml: 'ini',
          md: 'markdown', html: 'html', css: 'css', scss: 'scss',
          sh: 'shell', bash: 'shell', zsh: 'shell',
          xml: 'xml', sql: 'sql', dockerfile: 'dockerfile',
        };
        return map[ext] || 'plaintext';
      }

      function isMarkdownPath(path) {
        return /\.(md|markdown|mdown|mkdn)$/i.test(path || '');
      }

      function scheduleMarkdownPreviewUpdate(content) {
        if (!openPath || !isMarkdownPath(openPath)) return;
        if (markdownUpdateTimer) clearTimeout(markdownUpdateTimer);
        markdownUpdateTimer = setTimeout(() => {
          showMarkdownPreview(openPath, content).catch((e) => {
            setStatusFlash('markdown preview failed: ' + (e?.message || e));
          });
        }, 160);
      }

      function ensureLoaded() {
        if (loaded) return Promise.resolve();
        if (loading) return loading;
        loading = new Promise((resolve, reject) => {
          // Step 1: AMD loader. cdnjs ships the UMD `loader.min.js` that
          // bootstraps Monaco's internal AMD module graph.
          const script = document.createElement('script');
          script.src = MONACO_BASE + '/vs/loader.min.js';
          script.onload = () => {
            // Step 2: configure paths + require the editor module.
            const requireJs = window.require;
            if (!requireJs || typeof requireJs.config !== 'function') {
              reject(new Error('Monaco AMD loader failed to register'));
              return;
            }
            requireJs.config({ paths: { 'vs': MONACO_BASE + '/vs' } });
            requireJs(['vs/editor/editor.main'], () => {
              try {
                createEditor();
                loaded = true;
                resolve();
              } catch (e) {
                reject(e);
              }
            });
          };
          script.onerror = () => reject(new Error('Failed to load Monaco AMD loader from ' + script.src));
          document.head.appendChild(script);
        });
        return loading;
      }

      function createEditor() {
        const container = document.getElementById('monaco-container');
        container.style.display = 'block';
        // Hide the placeholder once Monaco mounts.
        const ph = document.getElementById('editorPlaceholder');
        if (ph) ph.style.display = 'none';

        // VS Code-like editor defaults for TS/JS files.
        editor = window.monaco.editor.create(container, {
          value: '',
          language: 'plaintext',
          theme: 'vs-dark',                                  // VSCode dark theme
          // Critical for split-pane resize — Monaco re-measures on
          // ResizeObserver hits without explicit layout() calls.
          automaticLayout: true,
          // Visual chrome.
          minimap: { enabled: true, side: 'right', renderCharacters: true, maxColumn: 120, scale: 1 },
          lineNumbers: 'on',
          lineNumbersMinChars: 3,
          glyphMargin: false,
          folding: true,
          renderLineHighlight: 'all',
          renderWhitespace: 'selection',
          renderControlCharacters: false,
          renderFinalNewline: 'on',
          // Cursor + selection chrome.
          cursorBlinking: 'smooth',
          cursorSmoothCaretAnimation: 'on',
          cursorStyle: 'line',
          cursorWidth: 2,
          // Typography. VSCode defaults to 14px Menlo/Monaco/Consolas.
          fontFamily: "Menlo, Monaco, 'Courier New', 'JetBrains Mono', 'Fira Code', monospace",
          fontSize: 14,
          lineHeight: 22,
          fontLigatures: true,
          // Whitespace / indent.
          tabSize: 2,
          insertSpaces: true,
          detectIndentation: true,
          trimAutoWhitespace: true,
          // Bracket / indent guides — the colorful nested brackets +
          // dotted vertical indent lines users expect from VSCode.
          bracketPairColorization: { enabled: true, independentColorPoolPerBracketType: true },
          guides: {
            bracketPairs: 'active',
            bracketPairsHorizontal: 'active',
            indentation: true,
            highlightActiveIndentation: true,
            highlightActiveBracketPair: true,
          },
          matchBrackets: 'always',
          // Editing behavior.
          autoIndent: 'full',
          autoClosingBrackets: 'languageDefined',
          autoClosingQuotes: 'languageDefined',
          autoSurround: 'languageDefined',
          formatOnPaste: true,
          formatOnType: true,
          // Multi-cursor and selection ergonomics.
          multiCursorModifier: 'alt',
          columnSelection: false,
          // Word wrap (toggle-friendly default).
          wordWrap: 'on',
          wordWrapColumn: 120,
          wrappingIndent: 'indent',
          // Scrolling.
          smoothScrolling: true,
          mouseWheelScrollSensitivity: 1,
          fastScrollSensitivity: 5,
          scrollBeyondLastLine: false,
          scrollbar: {
            vertical: 'auto',
            horizontal: 'auto',
            useShadows: true,
            verticalScrollbarSize: 14,
            horizontalScrollbarSize: 14,
          },
          // Suggest / IntelliSense (works for built-in languages even
          // without LSP — Monaco ships JS/TS/JSON/HTML/CSS workers
          // lazily; we leave the defaults).
          suggestOnTriggerCharacters: true,
          acceptSuggestionOnEnter: 'on',
          quickSuggestions: { other: true, comments: false, strings: false },
          parameterHints: { enabled: true, cycle: true },
          // Misc polish.
          stickyScroll: { enabled: true },
          links: true,
          dragAndDrop: true,
          mouseStyle: 'text',
          contextmenu: true,
          copyWithSyntaxHighlighting: false,
        });
        window.__nimbusMonacoEditor = editor;
        // Dirty-state tracking. Also propagate to FileTree so the
        // tree row shows the dirty dot (matches editor tab).
        editor.onDidChangeModelContent(() => {
          if (!openPath) return;
          const cur = editor.getValue();
          const dirty = cur !== originalContent;
          setTabFile(openPath, dirty);
          if (typeof FileTree !== 'undefined') {
            try { FileTree.markDirty(openPath, dirty); } catch {}
          }
          if (isMarkdownPath(openPath)) {
            scheduleMarkdownPreviewUpdate(cur);
          }
        });
        // Cursor position → status bar.
        const statusPos = document.getElementById('editorStatusPos');
        const statusLang = document.getElementById('editorStatusLang');
        editor.onDidChangeCursorPosition((e) => {
          if (statusPos) statusPos.textContent = 'Ln ' + e.position.lineNumber + ', Col ' + e.position.column;
        });
        editor.onDidChangeModelLanguage((e) => {
          if (statusLang) statusLang.textContent = e.newLanguage || 'plaintext';
        });
        // Ctrl+S save — Monaco intercepts the keystroke when focused.
        editor.addCommand(window.monaco.KeyMod.CtrlCmd | window.monaco.KeyCode.KeyS, () => save());
        // Cmd+P / Ctrl+P inside the editor → palette (palette also has
        // a global keydown handler but registering at the editor level
        // is what real VSCode does, so feel matches).
        editor.addCommand(window.monaco.KeyMod.CtrlCmd | window.monaco.KeyCode.KeyP, () => openPalette());
        // Layout once after creation so the editor sizes correctly.
        setTimeout(() => editor.layout(), 0);
      }

      async function openFile(path, options = {}) {
        if (!path) return;
        // Dirty-prompt before switching files. If the current buffer has
        // unsaved changes, ask the user whether to save or discard.
        // Skip when switching to the SAME file (no-op) or when there
        // is no editor yet.
        if (editor && openPath && openPath !== path) {
          const cur = editor.getValue();
          if (cur !== originalContent) {
            const choice = confirm(
              'Unsaved changes in ' + openPath + '\n\n' +
              'OK = save and switch.\n' +
              'Cancel = discard changes and switch.'
            );
            if (choice) {
              await save();
            }
            // Either way, proceed to load the new file (the user
            // explicitly chose to leave the current buffer).
          }
        }
        await ensureLoaded();
        let result;
        try {
          result = await fsRequest({ type: 'fs-read', path }, 'fs-read-result');
        } catch (e) {
          setStatusFlash('open failed: ' + (e?.message || e));
          return;
        }
        if (result.error) {
          if (result.binary) {
            setStatusFlash('binary file refused: ' + path);
          } else {
            setStatusFlash('open failed: ' + result.error);
          }
          return;
        }
        const content = result.content || '';
        openPath = path;
        originalContent = content;
        const lang = languageFor(path);
        // Recreate model so language detection takes effect (Monaco
        // doesn't auto-relanguage on setValue).
        const model = window.monaco.editor.createModel(content, lang);
        const old = editor.getModel();
        editor.setModel(model);
        if (old) try { old.dispose(); } catch {}
        setTabFile(path, false);
        // Reflect language in the bottom statusbar.
        const statusLang = document.getElementById('editorStatusLang');
        if (statusLang) statusLang.textContent = lang;
        const statusPos = document.getElementById('editorStatusPos');
        if (statusPos) statusPos.textContent = 'Ln 1, Col 1';
        // Mirror palette/Ctrl+P selection into the file tree.
        if (typeof FileTree !== 'undefined') {
          try { FileTree.setSelected(path); FileTree.markDirty(path, false); } catch {}
        }
        if (isMarkdownPath(path)) {
          // A file the user asked for takes the preview panel. The boot-time
          // default does not take it from something live: Monaco loads lazily,
          // so `openDefaultWelcome` can land seconds after a dev server the
          // user started has already filled the panel, and stealing it there
          // reads as the preview jumping to welcome.md on its own.
          const focus = !options.deferredDefault || !previewFocusIsClaimed();
          showMarkdownPreview(path, content, { focus }).catch((e) => {
            setStatusFlash('markdown preview failed: ' + (e?.message || e));
          });
        } else if (!options.keepMarkdownPreview) {
          showAppPreview();
        }
        // Same rule as the preview panel above, for the other thing this
        // takes. The boot default lands whenever Monaco finishes loading, so
        // it must not pull the keyboard out of whatever already has it — the
        // shell, or an attached TUI's xterm the user is typing into. Opening
        // a file the user asked for still focuses the editor.
        const holdsFocus = document.activeElement && document.activeElement !== document.body;
        if (!options.deferredDefault || !holdsFocus) editor.focus();
      }

      async function save() {
        if (!openPath || !editor) return;
        const content = editor.getValue();
        let result;
        try {
          result = await fsRequest({ type: 'fs-write', path: openPath, content }, 'fs-write-result');
        } catch (e) {
          setStatusFlash('save failed: ' + (e?.message || e));
          return;
        }
        if (!result.ok) {
          setStatusFlash('save failed: ' + (result.error || 'unknown'));
          return;
        }
        originalContent = content;
        setTabFile(openPath, false);
        if (typeof FileTree !== 'undefined') {
          try { FileTree.markDirty(openPath, false); } catch {}
        }
        setStatusFlash('saved');
      }

      let flashTimer = null;
      function setStatusFlash(text) {
        const el = tabEl();
        const prior = el.textContent;
        el.textContent = text;
        if (flashTimer) clearTimeout(flashTimer);
        flashTimer = setTimeout(() => setTabFile(openPath, false), 1400);
      }

      // ── Ctrl+P palette ──
      const overlay = document.getElementById('paletteOverlay');
      const input = document.getElementById('paletteInput');
      const list = document.getElementById('paletteList');
      let paletteFiles = [];
      let paletteFiltered = [];
      let paletteActive = 0;

      async function openPalette() {
        await ensureLoaded();
        overlay.classList.add('active');
        input.value = '';
        input.focus();
        // Re-fetch list if cache stale.
        const now = Date.now();
        if (!fileListCache || (now - fileListCachedAt) > 5000) {
          list.innerHTML = '<div class="palette-empty">Loading…</div>';
          try {
            const r = await fsRequest({ type: 'fs-list', dir: '/home/user', recursive: true }, 'fs-list-result');
            fileListCache = (r.entries || []).filter(e => e.type !== 'directory').map(e => e.path);
            fileListCachedAt = Date.now();
          } catch (e) {
            list.innerHTML = '<div class="palette-empty">fs-list failed: ' + (e?.message || e) + '</div>';
            return;
          }
        }
        paletteFiles = fileListCache.slice();
        renderPalette('');
      }
      function closePalette() {
        overlay.classList.remove('active');
        if (editor) editor.focus();
      }
      function renderPalette(q) {
        const needle = q.toLowerCase();
        // Simple substring + suffix-rank filter. Plenty fast for a few
        // thousand files (5 MB cap on fs-list anyway).
        paletteFiltered = paletteFiles
          .filter(p => p.toLowerCase().includes(needle))
          .slice(0, 80);
        paletteActive = 0;
        if (paletteFiltered.length === 0) {
          list.innerHTML = '<div class="palette-empty">No matches.</div>';
          return;
        }
        list.innerHTML = paletteFiltered.map((p, i) =>
          '<div class="palette-item' + (i === 0 ? ' active' : '') + '" data-idx="' + i + '">' + p + '</div>'
        ).join('');
        // Click to open.
        list.querySelectorAll('.palette-item').forEach(el => {
          el.addEventListener('click', () => {
            const idx = parseInt(el.dataset.idx, 10);
            const path = paletteFiltered[idx];
            if (path) {
              closePalette();
              openFile(path);
            }
          });
        });
      }
      function moveActive(delta) {
        const next = Math.max(0, Math.min(paletteFiltered.length - 1, paletteActive + delta));
        if (next === paletteActive) return;
        paletteActive = next;
        list.querySelectorAll('.palette-item').forEach((el, i) => {
          el.classList.toggle('active', i === paletteActive);
          if (i === paletteActive) el.scrollIntoView({ block: 'nearest' });
        });
      }
      input.addEventListener('input', () => renderPalette(input.value));
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') { e.preventDefault(); closePalette(); return; }
        if (e.key === 'ArrowDown') { e.preventDefault(); moveActive(1); return; }
        if (e.key === 'ArrowUp') { e.preventDefault(); moveActive(-1); return; }
        if (e.key === 'Enter') {
          e.preventDefault();
          const path = paletteFiltered[paletteActive];
          if (path) { closePalette(); openFile(path); }
        }
      });
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) closePalette();
      });

      // Global Ctrl+P / Cmd+P binding. Fires anywhere on the page so
      // users can open the palette from the terminal pane too — matches
      // VSCode UX.
      document.addEventListener('keydown', (e) => {
        const isCtrlP = (e.ctrlKey || e.metaKey) && e.key === 'p' && !e.shiftKey && !e.altKey;
        if (isCtrlP) {
          e.preventDefault();
          openPalette();
          return;
        }
        // Ctrl+S anywhere also saves (Monaco's own binding covers
        // the editor-focus case but a click outside the editor would
        // otherwise lose the keystroke).
        const isCtrlS = (e.ctrlKey || e.metaKey) && e.key === 's' && !e.shiftKey && !e.altKey;
        if (isCtrlS && openPath) {
          e.preventDefault();
          save();
        }
      });

      // External invalidation of the Cmd+P 5s-TTL palette cache. Called by the fs-watch-event
      // dispatcher in ws.onmessage so a terminal-side write makes
      // the next openPalette re-run fs-list instead of serving
      // stale results.
      function invalidateFileListCache() {
        fileListCache = null;
        fileListCachedAt = 0;
      }

      function openDefaultWelcome() {
        if (openPath) return Promise.resolve();
        return openFile(DEFAULT_WELCOME_PATH, { deferredDefault: true });
      }

      function refreshMarkdownPreview() {
        if (!openPath || !editor || !isMarkdownPath(openPath)) return Promise.resolve();
        return showMarkdownPreview(openPath, editor.getValue());
      }

      return {
        ensureLoaded, openFile, save, openPalette, tryHandleFsResult,
        drainFsQueue, invalidateFileListCache, openDefaultWelcome,
        refreshMarkdownPreview,
      };
    })();

    // ── FileTree module ──
    //
    // VSCode-style left sidebar showing the user VFS (rooted at
    // /home/user). Lazy-loads on first editor-mode activation. Tree
    // is flat in DOM (one .tree-node per row) with padding-left
    // calculated per depth — gives a clean expand/collapse animation
    // without nested ULs.
    //
    // Behavior:
    //   - First render: lazy fs-list /home/user (recursive=false)
    //   - Folder click: toggle expanded; on first expand, lazy
    //     fs-list that folder
    //   - File click: Editor.openFile(path) — Editor handles dirty
    //     prompt + Monaco model swap
    //   - Search filter: client-side substring on path, hides nodes
    //   - New file/folder: prompt + fs-write (empty content for
    //     file; for folder we synthesize an empty .keep file inside
    //     so fs-list shows it — VFS has no separate mkdir over WS)
    //   - Refresh: re-fetch root, drop cached children
    //   - Expanded state persisted via localStorage keyed on session id
    //
    // Memory: tree state is a flat Map<path, node>; max 10k entries
    // before we stop expanding to protect the browser.
    const FileTree = (function() {
      const panel = document.getElementById('treePanel');
      const body = document.getElementById('treeBody');
      const searchInput = document.getElementById('treeSearch');
      const btnNewFile = document.getElementById('btnTreeNewFile');
      const btnNewDir = document.getElementById('btnTreeNewDir');
      const btnRefresh = document.getElementById('btnTreeRefresh');

      const ROOT = '/home/user';
      const MAX_NODES = 10_000;
      const LS_KEY = 'nimbus.tree.expanded.' + (SESSION_PREFIX || 'noid');

      // node: { path, name, type:'file'|'directory', depth, parent, children?:Set<path>, loaded:bool, selected:bool, hidden:bool }
      const nodes = new Map();
      // Insertion-ordered list of paths for stable render.
      const renderOrder = [];
      let loaded = false;
      let pending = null;
      let nextReqId = 70_000;
      const pendingReqs = new Map();
      let selectedPath = null;

      function loadExpandedSet() {
        try {
          const raw = localStorage.getItem(LS_KEY);
          if (!raw) return new Set([ROOT]);
          return new Set(JSON.parse(raw));
        } catch { return new Set([ROOT]); }
      }
      function saveExpandedSet(set) {
        try { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(set))); } catch {}
      }
      const expanded = loadExpandedSet();
      expanded.add(ROOT);

      // Outbound queue mirrors Editor.fsRequest for the same websocket
      // connection race.
      const outQueue = [];
      function fsRequest(frame, resultType) {
        const reqId = nextReqId++;
        frame.reqId = reqId;
        return new Promise((resolve, reject) => {
          const t = setTimeout(() => {
            if (pendingReqs.has(reqId)) {
              pendingReqs.delete(reqId);
              reject(new Error('fs request timed out'));
            }
          }, 15000);
          pendingReqs.set(reqId, { resolve, reject, t });
          if (ws && ws.readyState === WebSocket.OPEN) {
            try { ws.send(JSON.stringify(frame)); }
            catch (e) {
              clearTimeout(t); pendingReqs.delete(reqId); reject(e);
            }
          } else {
            outQueue.push(frame);
          }
        });
      }
      function drainFsQueue() {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        const drained = outQueue.splice(0);
        for (const frame of drained) {
          try { ws.send(JSON.stringify(frame)); }
          catch (e) {
            const slot = pendingReqs.get(frame.reqId);
            if (slot) {
              pendingReqs.delete(frame.reqId);
              clearTimeout(slot.t);
              if (slot.reject) slot.reject(e);
            }
          }
        }
      }
      // Hook into main WS onmessage like the Editor module does.
      function tryHandleFsResult(msg) {
        if (!msg || typeof msg.type !== 'string') return false;
        if (!msg.type.endsWith('-result')) return false;
        const reqId = msg.reqId;
        if (typeof reqId !== 'number') return false;
        const slot = pendingReqs.get(reqId);
        if (!slot) return false;
        pendingReqs.delete(reqId);
        clearTimeout(slot.t);
        slot.resolve(msg);
        return true;
      }

      function iconFor(node) {
        if (node.type === 'directory') return node.expanded ? '📂' : '📁';
        // Light extension-based icons.
        const dot = node.name.lastIndexOf('.');
        const ext = dot >= 0 ? node.name.slice(dot + 1).toLowerCase() : '';
        const m = {
          js:'📜', mjs:'📜', cjs:'📜', ts:'📘', tsx:'📘', jsx:'📜',
          py:'🐍', rb:'💎', go:'🐹', rs:'🦀',
          c:'🔧', h:'🔧', cpp:'🔧', hpp:'🔧',
          json:'⚙️', yaml:'⚙️', yml:'⚙️', toml:'⚙️',
          md:'📝', html:'🌐', css:'🎨', scss:'🎨',
          sh:'🐚', bash:'🐚',
          png:'🖼️', jpg:'🖼️', jpeg:'🖼️', gif:'🖼️', svg:'🖼️',
          lock:'🔒',
        };
        return m[ext] || '📄';
      }

      function relativeName(path) {
        const i = path.lastIndexOf('/');
        return i >= 0 ? path.substring(i + 1) : path;
      }
      function parentOf(path) {
        const i = path.lastIndexOf('/');
        if (i <= 0) return '';
        return path.substring(0, i);
      }
      function depthOf(path) {
        // /home/user/foo/bar.txt → 2 (relative to /home/user which is root, depth 0)
        if (!path.startsWith(ROOT)) return 0;
        const rest = path.substring(ROOT.length).replace(/^\/+/, '');
        if (!rest) return 0;
        return rest.split('/').length;
      }

      function ensureNode(path, type) {
        let n = nodes.get(path);
        if (n) {
          if (type) n.type = type;
          return n;
        }
        n = {
          path, name: relativeName(path) || path,
          type: type || 'file',
          depth: depthOf(path),
          loaded: false, expanded: expanded.has(path),
          dirty: false,
        };
        nodes.set(path, n);
        return n;
      }

      async function loadFolder(path) {
        // Show a loading hint if this is the FIRST load AND the WS
        // hasn't opened yet (queue fix — request is pending until
        // ws.onopen drains it). Without this hint, users staring at
        // an empty tree-body would see no feedback. Cleared on
        // success / error path below.
        if (path === ROOT && !loaded && (!ws || ws.readyState !== WebSocket.OPEN)) {
          body.innerHTML = '<div class="tree-empty">Waiting for connection…</div>';
        }
        let result;
        try {
          result = await fsRequest({ type: 'fs-list', dir: path, recursive: false }, 'fs-list-result');
        } catch (e) {
          body.innerHTML = '<div class="tree-empty">fs-list failed: ' + escapeHtml(e?.message || String(e)) + '</div>';
          return;
        }
        if (result.error) {
          body.innerHTML = '<div class="tree-empty">' + escapeHtml(result.error) + '</div>';
          return;
        }
        const entries = result.entries || [];
        const folder = ensureNode(path, 'directory');
        folder.loaded = true;
        // Insert children — sort: directories first, alphabetical.
        entries.sort((a, b) => {
          if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
          return a.path.localeCompare(b.path);
        });
        for (const e of entries) {
          if (nodes.size >= MAX_NODES) break;
          ensureNode(e.path, e.type);
        }
        rerender();
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) => ({
          '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;',
        })[c]);
      }

      // Compute the rendered order: walk tree depth-first, including
      // only children of expanded folders. Hidden filter applied at
      // search time.
      function computeOrder() {
        const out = [];
        function walk(parentPath, depth) {
          // Collect direct children of parentPath in the nodes map.
          const children = [];
          for (const n of nodes.values()) {
            if (parentOf(n.path) === parentPath) children.push(n);
          }
          children.sort((a, b) => {
            if (a.type !== b.type) return a.type === 'directory' ? -1 : 1;
            return a.name.localeCompare(b.name);
          });
          for (const c of children) {
            out.push(c);
            if (c.type === 'directory' && expanded.has(c.path)) {
              walk(c.path, depth + 1);
            }
          }
        }
        walk(ROOT, 1);
        return out;
      }

      function rerender() {
        const order = computeOrder();
        const filter = (searchInput.value || '').trim().toLowerCase();
        body.innerHTML = '';
        if (order.length === 0) {
          body.innerHTML = '<div class="tree-empty">Empty</div>';
          return;
        }
        const frag = document.createDocumentFragment();
        let visibleCount = 0;
        for (const n of order) {
          const matchesFilter = !filter || n.path.toLowerCase().includes(filter);
          if (!matchesFilter) continue;
          visibleCount++;
          const div = document.createElement('div');
          let cls = 'tree-node ' + (n.type === 'directory' ? 'dir' : 'file');
          if (n.type === 'directory' && expanded.has(n.path)) cls += ' expanded';
          if (selectedPath === n.path) cls += ' selected';
          if (n.dirty) cls += ' dirty';
          div.className = cls;
          div.dataset.path = n.path;
          div.style.paddingLeft = (8 + (n.depth - 1) * 14) + 'px';
          div.innerHTML =
            '<span class="tree-chevron">▶</span>' +
            '<span class="tree-icon">' + iconFor(n) + '</span>' +
            '<span class="tree-label"></span>';
          div.querySelector('.tree-label').textContent = n.name;
          div.addEventListener('click', () => handleNodeClick(n));
          frag.appendChild(div);
        }
        body.appendChild(frag);
        if (visibleCount === 0 && filter) {
          body.innerHTML = '<div class="tree-empty">No matches for "' + escapeHtml(filter) + '"</div>';
        }
      }

      function setSelected(path) {
        selectedPath = path;
        rerender();
      }

      async function handleNodeClick(node) {
        if (node.type === 'directory') {
          if (expanded.has(node.path)) {
            expanded.delete(node.path);
          } else {
            expanded.add(node.path);
            if (!node.loaded) {
              // Show a tentative state immediately, then async load.
              rerender();
              await loadFolder(node.path);
              saveExpandedSet(expanded);
              return;
            }
          }
          saveExpandedSet(expanded);
          rerender();
        } else {
          setSelected(node.path);
          Editor.openFile(node.path);
        }
      }

      async function ensureLoaded() {
        if (loaded) return;
        if (pending) return pending;
        panel.classList.add('loading');
        pending = (async () => {
          // Ensure root node + load it.
          ensureNode(ROOT, 'directory');
          await loadFolder(ROOT);
          // Auto-expand any persisted-expanded folders that are
          // already in the tree from the root load.
          for (const path of expanded) {
            if (path === ROOT) continue;
            const n = nodes.get(path);
            if (n && n.type === 'directory' && !n.loaded) {
              await loadFolder(path);
            }
          }
          loaded = true;
        })();
        try { await pending; } finally { pending = null; panel.classList.remove('loading'); }
      }

      // Toolbar actions.
      async function refreshTree() {
        // Drop all cached children of root + re-fetch.
        nodes.clear();
        loaded = false;
        await ensureLoaded();
      }
      async function newFile() {
        // Place in the currently-selected directory, or the root.
        let parent = ROOT;
        if (selectedPath) {
          const n = nodes.get(selectedPath);
          if (n) parent = n.type === 'directory' ? n.path : parentOf(n.path);
        }
        const name = prompt('New file name (relative to ' + parent + '):');
        if (!name) return;
        const path = parent + '/' + name.replace(/^\/+/, '');
        try {
          await fsRequest({ type: 'fs-write', path, content: '' }, 'fs-write-result');
          // Refresh the parent folder.
          const pn = nodes.get(parent);
          if (pn) {
            pn.loaded = false;
            await loadFolder(parent);
          }
          expanded.add(parent);
          saveExpandedSet(expanded);
          setSelected(path);
          Editor.openFile(path);
        } catch (e) {
          alert('Create file failed: ' + (e?.message || e));
        }
      }
      async function newDir() {
        let parent = ROOT;
        if (selectedPath) {
          const n = nodes.get(selectedPath);
          if (n) parent = n.type === 'directory' ? n.path : parentOf(n.path);
        }
        const name = prompt('New folder name (relative to ' + parent + '):');
        if (!name) return;
        const dirPath = parent + '/' + name.replace(/^\/+/, '');
        // Synthesize via .keep file — fs-write auto-mkdirs the parent
        // chain (init.ts handler does this).
        try {
          await fsRequest({ type: 'fs-write', path: dirPath + '/.keep', content: '' }, 'fs-write-result');
          const pn = nodes.get(parent);
          if (pn) { pn.loaded = false; await loadFolder(parent); }
          expanded.add(dirPath);
          saveExpandedSet(expanded);
          rerender();
        } catch (e) {
          alert('Create folder failed: ' + (e?.message || e));
        }
      }

      btnNewFile.addEventListener('click', newFile);
      btnNewDir.addEventListener('click', newDir);
      btnRefresh.addEventListener('click', refreshTree);
      searchInput.addEventListener('input', rerender);

      // Tree resize is owned by PaneResizer so all handles share one
      // persistence layer. Inline width is restored from localStorage.

      // Mark a path dirty in the tree (called by Editor when buffer
      // diverges from disk).
      function markDirty(path, isDirty) {
        const n = nodes.get(path);
        if (!n) return;
        if (n.dirty === !!isDirty) return;
        n.dirty = !!isDirty;
        rerender();
      }

      // ── File-watch subscribe + event apply ─────
      //
      // Server-side fs-watch protocol (src/session/fs-watch.ts):
      //
      //   IN  { type:'fs-watch-subscribe', reqId, paths:['/home/user'] }
      //   OUT { type:'fs-watch-subscribe-result', reqId, ok, subId? }
      //   PUSH { type:'fs-watch-event', subId, events:VfsEvent[], dropped? }
      //   IN  { type:'fs-watch-unsubscribe', reqId, subId? }
      //
      // Local lifecycle:
      //   - subscribeOnce() is called from ws.onopen (after drainFsQueue).
      //     Re-invocations are no-ops while a subId is live; on WS close
      //     the server-side listener is reaped (ws.ts cleanup) so the
      //     next reconnect re-subscribes fresh.
      //   - applyWatchEvent() coalesces all 'fs-watch-event' frames into
      //     per-parent refresh actions on a single 100ms window — 5+
      //     events that share the same parent dir produce ONE re-fetch
      //     of that folder, not N.
      //
      // Coalescing layers (composed):
      //   Server (50ms debounce, SUB_MAX_QUEUE=200, drop-oldest)
      //     → batches of up to 200 VfsEvents per frame
      //   Client (100ms per-parent debounce)
      //     → one fs-list per unique parent per window
      //
      // A `dropped:N` field on the incoming frame means the server
      // dropped N events to honor its cap; we respond by force-
      // refreshing the entire root (cheapest correct recovery).
      let watchSubId = null;
      const pendingParentRefresh = new Set();
      let watchRefreshTimer = null;
      let lastWatchFrameAt = 0;
      let watchFrameCount = 0;
      let watchEventCount = 0;
      const WATCH_COALESCE_MS = 100;

      function subscribeOnce() {
        if (watchSubId) return; // already subscribed
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        // Fire-and-forget — record the subId on the success result.
        // We use fsRequest's queued-send semantics for the reply
        // routing (pendingReqs keyed by reqId), but tolerate failures.
        fsRequest(
          { type: 'fs-watch-subscribe', paths: [ROOT] },
          'fs-watch-subscribe-result',
        ).then((r) => {
          if (r && r.ok && typeof r.subId === 'string') {
            watchSubId = r.subId;
          }
        }).catch(() => { /* server may not support fs-watch yet */ });
      }

      function scheduleParentRefreshFlush() {
        if (watchRefreshTimer) return;
        watchRefreshTimer = setTimeout(async () => {
          watchRefreshTimer = null;
          if (pendingParentRefresh.size === 0) return;
          const parents = Array.from(pendingParentRefresh);
          pendingParentRefresh.clear();
          for (const parent of parents) {
            const pn = nodes.get(parent);
            // Only re-fetch dirs we've already loaded (cheap + bounded).
            // Unloaded dirs are loaded lazily on expand.
            if (pn && pn.type === 'directory' && pn.loaded) {
              // Drop cached children then re-load the folder. The
              // ensureNode at the end of loadFolder keeps the node
              // entry alive (avoiding flicker on the user's selection).
              // We drop child nodes from the Map so loadFolder's
              // re-insert produces a clean view that reflects deletes.
              const prefix = parent + '/';
              for (const path of Array.from(nodes.keys())) {
                if (path !== parent && parentOf(path) === parent) {
                  nodes.delete(path);
                }
                else if (path !== parent && path.startsWith(prefix)) {
                  // children of children — drop too so a deleted subtree
                  // disappears in one cycle
                  nodes.delete(path);
                }
              }
              try { await loadFolder(parent); } catch { /* fail-soft */ }
            }
          }
        }, WATCH_COALESCE_MS);
      }

      // Dispatch an inbound fs-watch-event frame to
      // the tree's incremental refresh pipeline. Returns true if the
      // frame was consumed (caller short-circuits the rest of its
      // onmessage chain), false otherwise.
      function applyWatchEvent(msg) {
