        if (!msg || msg.type !== 'fs-watch-event') return false;
        watchFrameCount++;
        lastWatchFrameAt = Date.now();
        // Server-side drop signal → cheapest correct recovery is a
        // full root re-fetch. Clear the queue + force refresh.
        if (typeof msg.dropped === 'number' && msg.dropped > 0) {
          pendingParentRefresh.clear();
          if (watchRefreshTimer) {
            clearTimeout(watchRefreshTimer);
            watchRefreshTimer = null;
          }
          // schedule async refresh of root (preserves expanded state)
          (async () => {
            const expandedSnapshot = new Set(expanded);
            const wasLoaded = new Set();
            for (const n of nodes.values()) {
              if (n.type === 'directory' && n.loaded) wasLoaded.add(n.path);
            }
            nodes.clear();
            loaded = false;
            try { await ensureLoaded(); } catch {}
            // Re-load previously-loaded subdirs that are still expanded.
            for (const path of wasLoaded) {
              if (path === ROOT) continue;
              if (!expandedSnapshot.has(path)) continue;
              try { await loadFolder(path); } catch {}
            }
          })();
          return true;
        }
        const events = Array.isArray(msg.events) ? msg.events : [];
        if (events.length === 0) return true;
        watchEventCount += events.length;
        // Per-parent coalescing — collect unique parent dirs that need
        // a refresh. SqliteVFS paths are bare ('home/user/x.txt'); we
        // prepend '/' to match the absolute-path convention used by
        // the FileTree (ROOT === '/home/user').
        for (const ev of events) {
          if (!ev || typeof ev.path !== 'string') continue;
          const abs = ev.path.startsWith('/') ? ev.path : '/' + ev.path;
          if (!abs.startsWith(ROOT)) continue; // outside our watched root
          // For unlinkDir / rename(old), the affected parent is the
          // *old* path's parent; the new-path's parent gets refresh
          // via the same path entry below. For other events, just the
          // event path's parent.
          pendingParentRefresh.add(parentOf(abs));
          if (ev.type === 'rename' && typeof ev.oldPath === 'string') {
            const oldAbs = ev.oldPath.startsWith('/') ? ev.oldPath : '/' + ev.oldPath;
            if (oldAbs.startsWith(ROOT)) {
              pendingParentRefresh.add(parentOf(oldAbs));
            }
          }
        }
        // Invalidate the Cmd+P palette cache so the next openPalette
        // re-fetches the file list. Editor exposes this; tolerate
        // either lazy-init order.
        try {
          if (typeof Editor !== 'undefined' && typeof Editor.invalidateFileListCache === 'function') {
            Editor.invalidateFileListCache();
          }
        } catch { /* best-effort */ }
        if (pendingParentRefresh.size > 0) scheduleParentRefreshFlush();
        return true;
      }

      // Diagnostic accessor for probes (cleanup-on-disconnect verifies
      // counts return to 0 on the server side; this is the client-side
      // mirror — useful for the coalescing probe).
      function getWatchStats() {
        return {
          subId: watchSubId,
          frameCount: watchFrameCount,
          eventCount: watchEventCount,
          lastFrameAt: lastWatchFrameAt,
          pendingParents: pendingParentRefresh.size,
        };
      }

      return {
        ensureLoaded, tryHandleFsResult, markDirty, setSelected, drainFsQueue,
        subscribeOnce, applyWatchEvent, getWatchStats,
      };
    })();

    // Tabbed preview surface. Markdown preview and live app previews share
    // the right pane without fighting over a single iframe.
    let previewBackendKind = 'none'; // 'vite' | 'worker' | 'none'
    let activePreviewTabId = null;
    let markdownRenderSeq = 0;
    const previewTabs = new Map();

    function previewUrlFor(kind) {
      return kind === 'worker' ? WORKER_URL : VITE_URL;
    }

    // `/api/preview-url` is the single authority on whether this deployment
    // serves hostname-per-port previews and whether this session qualifies;
    // it answers `{url:null}` when it doesn't, and we fall back to the path
    // form. Mirroring its preconditions here would only let them drift.
    async function portPreviewUrl(port) {
      const pathUrl = SESSION_PREFIX + '/port/' + Number(port) + '/';
      try {
        const response = await fetch(
          SESSION_PREFIX + '/api/preview-url?port=' + Number(port),
        );
        if (!response.ok) return pathUrl;
        const result = await response.json();
        return typeof result?.url === 'string' && result.url ? result.url : pathUrl;
      } catch {
        return pathUrl;
      }
    }

    function previewNavigation(url) {
      try {
        const parsed = new URL(url, location.origin);
        if (!parsed.searchParams.has('nimbus_token')) {
          return { url, attachUrl: null, attachPending: false };
        }
        parsed.searchParams.delete('nimbus_token');
        return {
          url: parsed.href,
          attachUrl: url,
          attachPending: true,
        };
      } catch {
        return { url, attachUrl: null, attachPending: false };
      }
    }

    function absolutePreviewUrl(url) {
      return new URL(url, location.origin).href;
    }

    function shortPathLabel(path) {
      const parts = String(path || '').split('/').filter(Boolean);
      return parts[parts.length - 1] || 'Markdown';
    }

    /**
     * Has something with a real claim taken the preview panel? A running dev
     * server, worker or exposed port has; the idle placeholder and a markdown
     * preview have not. Read off the active tab rather than tracked
     * alongside it, so it cannot drift from what the user is looking at.
     */
    function previewFocusIsClaimed() {
      const active = activePreviewTabId ? previewTabs.get(activePreviewTabId) : null;
      return !!active && !!active.running;
    }

    function appTabFor(kind) {
      const appKind = kind === 'worker' ? 'worker' : 'vite';
      return {
        id: 'app:' + appKind,
        type: 'app',
        kind: appKind,
        label: appKind === 'worker' ? 'Worker' : 'Preview',
        title: appKind === 'worker' ? 'Cloudflare Worker preview' : 'Vite preview',
        url: previewUrlFor(appKind),
        running: previewBackendKind === appKind,
      };
    }

    function renderPreviewTabs() {
      if (!previewTabsEl) return;
      previewTabsEl.innerHTML = '';
      for (const tab of previewTabs.values()) {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = [
          'preview-tab',
          tab.type === 'markdown' ? 'markdown' : '',
          tab.running ? 'running' : '',
          tab.id === activePreviewTabId ? 'active' : '',
        ].filter(Boolean).join(' ');
        button.title = tab.title || tab.url || tab.path || tab.label;
        button.onclick = () => activatePreviewTab(tab.id);

        const label = document.createElement('span');
        label.className = 'preview-tab-label';
        label.textContent = tab.label;
        button.appendChild(label);

        previewTabsEl.appendChild(button);
      }
    }

    function ensurePreviewTab(tab, options = {}) {
      const existing = previewTabs.get(tab.id);
      const merged = {
        ...(existing || {}),
        ...tab,
        createdAt: existing?.createdAt || Date.now(),
        updatedAt: Date.now(),
      };
      previewTabs.set(tab.id, merged);
      if (!existing && options.focusNew) {
        activatePreviewTab(tab.id);
      } else {
        renderPreviewTabs();
      }
      return merged;
    }

    function firstAppTabId() {
      const port = [...previewTabs.values()].filter((tab) => tab.type === 'port').pop();
      if (port) return port.id;
      const preferred = previewBackendKind === 'worker' ? 'app:worker' : 'app:vite';
      if (previewTabs.has(preferred)) return preferred;
      if (previewTabs.has('app:vite')) return 'app:vite';
      if (previewTabs.has('app:worker')) return 'app:worker';
      return ensurePreviewTab(appTabFor('vite')).id;
    }

    function previewFrameOwnsAttach(tab) {
      if (!previewFrame || !tab.attachUrl) return false;
      const src = previewFrame.getAttribute('src') || '';
      return previewFrame.dataset.previewTabId === tab.id
        && previewFrame.dataset.previewAttachGeneration === String(tab.attachGeneration || 0)
        && absolutePreviewUrl(src) === absolutePreviewUrl(tab.attachUrl);
    }

    function refreshPortPreviewAttach(tab) {
      if (!tab || tab.type !== 'port' || tab.attachRefresh) return;
      const generation = (tab.attachGeneration || 0) + 1;
      tab.attachGeneration = generation;
      tab.attachPending = true;
      tab.attachInFlight = false;
      tab.attachUrl = null;
      tab.attachRefresh = portPreviewUrl(tab.port).then((minted) => {
        const current = previewTabs.get(tab.id);
        if (!current || current.attachGeneration !== generation) return;
        Object.assign(current, previewNavigation(minted), {
          attachGeneration: generation,
          attachInFlight: false,
          attachRefresh: null,
        });
        if (activePreviewTabId === current.id) activatePreviewTab(current.id);
      }).catch(() => {
        const current = previewTabs.get(tab.id);
        if (!current || current.attachGeneration !== generation) return;
        current.attachPending = false;
        current.attachInFlight = false;
        current.attachRefresh = null;
      });
    }

    function activatePreviewTab(id) {
      const tab = previewTabs.get(id);
      if (!tab) return;
      activePreviewTabId = id;
      renderPreviewTabs();
      if (tab.type === 'markdown') {
        previewPanel.classList.add('markdown-mode');
        if (previewFrame) previewFrame.style.display = 'none';
        if (markdownPreview) markdownPreview.classList.add('active');
        setPreviewUrlBar('Markdown Preview · ' + tab.path);
        paintMarkdownPreview(tab.markdown || '').catch(() => {});
        return;
      }

      previewPanel.classList.remove('markdown-mode');
      if (markdownPreview) markdownPreview.classList.remove('active');
      if (previewFrame) {
        previewFrame.style.display = 'block';
        if (tab.type === 'port' && tab.attachPending) {
          if (tab.attachInFlight) {
            if (!previewFrameOwnsAttach(tab)) refreshPortPreviewAttach(tab);
            setPreviewUrlBar(tab.url);
            return;
          }
          if (!tab.attachUrl) {
            refreshPortPreviewAttach(tab);
            setPreviewUrlBar(tab.url);
            return;
          }
          const generation = (tab.attachGeneration || 0) + 1;
          const attachUrl = tab.attachUrl;
          tab.attachGeneration = generation;
          tab.attachInFlight = true;
          previewFrame.dataset.previewTabId = tab.id;
          previewFrame.dataset.previewAttachGeneration = String(generation);
          previewFrame.addEventListener('load', () => {
            const current = previewTabs.get(tab.id);
            if (!current
              || current.attachGeneration !== generation
              || previewFrame.dataset.previewTabId !== tab.id
              || previewFrame.dataset.previewAttachGeneration !== String(generation)
              || absolutePreviewUrl(previewFrame.getAttribute('src') || '') !== absolutePreviewUrl(attachUrl)) {
              return;
            }
            current.attachPending = false;
            current.attachInFlight = false;
            current.attachUrl = null;
            current.attachRefresh = null;
          }, { once: true });
          previewFrame.src = attachUrl;
        } else {
          previewFrame.dataset.previewTabId = tab.id;
          delete previewFrame.dataset.previewAttachGeneration;
          const next = absolutePreviewUrl(tab.url);
          if (previewFrame.src !== next) previewFrame.src = tab.url;
        }
      }
      setPreviewUrlBar(tab.url);
    }

    function normalizePortStats(portStats) {
      const raw = Array.isArray(portStats?.ports)
        ? portStats.ports
        : Array.isArray(portStats)
          ? portStats
          : [];
      const seen = new Set();
      const ports = [];
      for (const entry of raw) {
        const port = Number(entry?.port);
        if (!Number.isInteger(port) || port <= 0 || seen.has(port)) continue;
        seen.add(port);
        ports.push({ port, pid: Number(entry?.pid) || 0 });
      }
      return ports;
    }

    async function syncPortPreviewTabs(portStats, canonicalPort, canonicalTabId) {
      const ports = normalizePortStats(portStats);
      const hiddenPort = Number.isInteger(canonicalPort) && canonicalPort > 0 ? canonicalPort : null;
      const visiblePorts = hiddenPort == null
        ? ports
        : ports.filter((p) => p.port !== hiddenPort);
      const live = new Set(visiblePorts.map((p) => 'port:' + p.port));
      let activeWasRemoved = false;
      let activeWasCanonicalAlias = false;

      for (const [id, tab] of previewTabs) {
        if (tab.type === 'port' && !live.has(id)) {
          previewTabs.delete(id);
          if (activePreviewTabId === id) {
            activeWasRemoved = true;
            activeWasCanonicalAlias = hiddenPort != null && tab.port === hiddenPort;
          }
        }
      }

      for (const entry of visiblePorts) {
        const id = 'port:' + entry.port;
        let existing = previewTabs.get(id);
        let navigation = {};
        if (!existing) {
          const minted = await portPreviewUrl(entry.port);
          existing = previewTabs.get(id);
          if (!existing) navigation = previewNavigation(minted);
        }
        ensurePreviewTab({
          id,
          type: 'port',
          port: entry.port,
          pid: entry.pid,
          label: ':' + entry.port,
          title: 'Port ' + entry.port,
          ...navigation,
          running: true,
        }, { focusNew: !existing });
      }

      if (activeWasRemoved || !activePreviewTabId || !previewTabs.has(activePreviewTabId)) {
        activatePreviewTab(activeWasCanonicalAlias && canonicalTabId ? canonicalTabId : firstAppTabId());
      } else {
        renderPreviewTabs();
      }
    }

    function setPreviewUrlBar(value) {
      const urlBar = document.getElementById('urlBar');
      if (urlBar) urlBar.value = value;
    }

    function showAppPreview() {
      ensurePreviewTab(appTabFor(previewBackendKind));
      activatePreviewTab(firstAppTabId());
    }

    async function showMarkdownPreview(path, markdown, options = {}) {
      const id = 'markdown:' + path;
      ensurePreviewTab({
        id,
        type: 'markdown',
        label: shortPathLabel(path),
        title: path,
        path,
        markdown: markdown || '',
        running: false,
      });
      // The tab is always created; taking focus is the caller's to decide.
      // A deferred boot declines it when something live already holds the
      // panel, and the tab stays one click away with its content ready.
      if (options.focus === false) return;
      activatePreviewTab(id);
      if (activePreviewTabId !== id) return;
      await paintMarkdownPreview(markdown || '');
    }

    async function paintMarkdownPreview(markdown) {
      const seq = ++markdownRenderSeq;
      const html = await renderMarkdown(markdown || '');
      const active = activePreviewTabId ? previewTabs.get(activePreviewTabId) : null;
      if (seq === markdownRenderSeq && active?.type === 'markdown' && markdownPreviewBody) {
        markdownPreviewBody.innerHTML = html;
      }
    }

    async function renderMarkdown(markdown) {
      try {
        const island = await ensureAgentChat();
        return island.renderMarkdown(markdown || '');
      } catch (e) {
        return '<pre><code>' + escapeHtml(markdown) + '</code></pre>';
      }
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = String(s);
      return div.innerHTML;
    }

    function previewBackendPort(kind, stats) {
      const raw = kind === 'vite' ? stats?.vite?.port : null;
      const n = Number(raw);
      return Number.isInteger(n) && n > 0 ? n : null;
    }

    async function applyPreviewTarget(kind, stats) {
      const previousKind = previewBackendKind;
      previewBackendKind = kind === 'worker' || kind === 'vite' ? kind : 'none';
      const appKind = previewBackendKind === 'worker' ? 'worker' : 'vite';
      const appTab = ensurePreviewTab(appTabFor(appKind));
      const shouldFocusApp = previousKind !== previewBackendKind && previewBackendKind !== 'none';
      if (shouldFocusApp) activatePreviewTab(appTab.id);
      if (!activePreviewTabId) activatePreviewTab(appTab.id);
      await syncPortPreviewTabs(
        stats?.ports,
        previewBackendPort(previewBackendKind, stats),
        appTab.id,
      );
    }

    function reloadPreview() {
      const active = activePreviewTabId ? previewTabs.get(activePreviewTabId) : null;
      if (active?.type === 'markdown') {
        Editor.refreshMarkdownPreview().catch(() => {});
        return;
      }
      if (active?.type === 'port' && active.attachPending) {
        refreshPortPreviewAttach(active);
        return;
      }
      // Refreshing without a running backend should re-poll the
      // placeholder so users see dev-server status update promptly.
      if (!active || previewFrame.src === 'about:blank') {
        activatePreviewTab(firstAppTabId());
      } else {
        try { previewFrame.contentWindow?.location.reload(); }
        catch { previewFrame.src = previewFrame.src; }
      }
    }

    applyPreviewTarget('none', null).catch(() => {});

    // ── Pane resize manager ──
    //
    // Owns the three workspace resize handles:
    //   H1 tree ↔ center stack (col)       — TreeResizeHandle in FileTree IIFE
    //   H2 center stack ↔ preview (col)    — #resizeHandle
    //   V1 top surface ↔ terminal (row)    — #editorTerminalResizeHandle
    //
    // Each handle persists its dimension to localStorage so a reload
    // restores the user's layout. Keyed per-session.
    //
    // Triggers Monaco editor.layout() + xterm fitAddon.fit() after
    // every drag-end so the wrapped panes re-measure. Mid-drag does
    // a cheap fit too (xterm) for the "live shrink" feel; Monaco
    // automaticLayout:true handles itself.
    const PaneResizer = (function() {
      const LS_DIMS = 'nimbus.pane.dims.' + (SESSION_PREFIX || 'noid');
      // Default flex basis percentages — match the CSS defaults above.
      // Persisted to LS; restored before first setLayout call.
      let dims = {
        treeWidth: 250,      // px
        middlePct: 60,       // % of main width for left-stack/terminal (rest = preview)
        editorPct: 60,       // % of left-stack height for editor (rest = terminal)
      };

      function loadDims() {
        try {
          const raw = localStorage.getItem(LS_DIMS);
          if (raw) Object.assign(dims, JSON.parse(raw));
        } catch {}
      }
      function saveDims() {
        try { localStorage.setItem(LS_DIMS, JSON.stringify(dims)); } catch {}
      }

      function applyMonacoLayout() {
        if (window.__nimbusMonacoEditor) {
          try { window.__nimbusMonacoEditor.layout(); } catch {}
        }
      }
      function applyTerminalFit() {
        try { fitAddon.fit(); } catch {}
        // A process view may own the panel instead of the shell xterm.
        if (typeof ProcSidebar !== 'undefined') ProcSidebar.refitActive();
      }
      function applyAll() {
        // Tree width — applied as inline width on .panel-tree.
        const tree = document.getElementById('treePanel');
        if (tree) tree.style.width = dims.treeWidth + 'px';
        // Middle ↔ preview flex.
        applyMiddlePreviewFlex();
        // Editor ↔ terminal flex (inside left-stack).
        applyEditorTerminalFlex();
        applyTerminalFit();
        applyMonacoLayout();
      }

      // Map middlePct to the center workspace and preview columns.
      function applyMiddlePreviewFlex() {
        const stack = document.getElementById('leftStack');
        const term = mainPanel.querySelector('.panel-terminal');
        const prev = mainPanel.querySelector('.panel-preview');
        const middlePct = Math.max(20, Math.min(80, dims.middlePct));
        if (stack) stack.style.flex = middlePct + ' 0 0%';
        if (prev) prev.style.flex = (100 - middlePct) + ' 0 0%';
        if (term) term.style.flex = '';
      }

      function applyEditorTerminalFlex() {
        if (layout !== 'editor') return;
        const topSurface = workSurface === 'agent'
          ? document.getElementById('agentPanel')
          : document.getElementById('editorPanel');
        const term = mainPanel.querySelector('.panel-terminal');
        const editorPct = Math.max(10, Math.min(90, dims.editorPct));
        if (topSurface) topSurface.style.flex = editorPct + ' 0 0%';
        if (term) term.style.flex = (100 - editorPct) + ' 0 0%';
      }

      // Drag wiring.
      let activeHandle = null;
      let dragStartXY = 0;
      let dragStartDim = 0;
      let dragStartTotal = 0;

      function startDrag(kind, e) {
        activeHandle = kind;
        e.preventDefault();
        const rect = mainPanel.getBoundingClientRect();
        const stack = document.getElementById('leftStack');
        if (kind === 'tree') {
          dragStartXY = e.clientX;
          dragStartDim = dims.treeWidth;
          dragStartTotal = rect.width;
          document.body.style.cursor = 'col-resize';
        } else if (kind === 'middle') {
          dragStartXY = e.clientX;
          dragStartDim = dims.middlePct;
          dragStartTotal = rect.width;
          document.body.style.cursor = 'col-resize';
        } else if (kind === 'editor-terminal') {
          dragStartXY = e.clientY;
          dragStartDim = dims.editorPct;
          // The vertical handle moves within the left-stack column.
          dragStartTotal = stack ? stack.getBoundingClientRect().height : rect.height;
          document.body.style.cursor = 'row-resize';
        }
      }

      function onMove(e) {
        if (!activeHandle) return;
        if (activeHandle === 'tree') {
          const dx = e.clientX - dragStartXY;
          dims.treeWidth = Math.max(160, Math.min(600, dragStartDim + dx));
          const tree = document.getElementById('treePanel');
          if (tree) tree.style.width = dims.treeWidth + 'px';
          applyTerminalFit();
          applyMonacoLayout();
        } else if (activeHandle === 'middle') {
          const dx = e.clientX - dragStartXY;
          const pctDelta = (dx / dragStartTotal) * 100;
          dims.middlePct = Math.max(20, Math.min(80, dragStartDim + pctDelta));
          applyMiddlePreviewFlex();
          applyTerminalFit();
          applyMonacoLayout();
        } else if (activeHandle === 'editor-terminal') {
          const dy = e.clientY - dragStartXY;
          const pctDelta = (dy / dragStartTotal) * 100;
          dims.editorPct = Math.max(10, Math.min(90, dragStartDim + pctDelta));
          applyEditorTerminalFlex();
          applyTerminalFit();
          applyMonacoLayout();
        }
      }

      function endDrag() {
        if (!activeHandle) return;
        activeHandle = null;
        document.body.style.cursor = '';
        saveDims();
        applyTerminalFit();
        applyMonacoLayout();
      }

      // Wire up the three handles.
      function bindHandles() {
        const h1 = document.getElementById('treeResizeHandle');
        const h2 = document.getElementById('resizeHandle');
        const v1 = document.getElementById('editorTerminalResizeHandle');
        if (h1) h1.addEventListener('mousedown', (e) => startDrag('tree', e));
        if (h2) h2.addEventListener('mousedown', (e) => startDrag('middle', e));
        if (v1) v1.addEventListener('mousedown', (e) => startDrag('editor-terminal', e));
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', endDrag);
      }

      function restoreDims() {
        loadDims();
        // Apply tree width inline so first paint shows the persisted size.
        const tree = document.getElementById('treePanel');
        if (tree) tree.style.width = dims.treeWidth + 'px';
      }

      // Re-apply dims any time setLayout() switches surfaces.
      function onLayoutChange() {
        applyMiddlePreviewFlex();
        applyEditorTerminalFlex();
      }

      bindHandles();
      return { restoreDims, applyAll, onLayoutChange };
    })();

    // ── Status ──
    // `label` overrides the text for states the three dot colours already
    // cover — "Reconnecting..." and "Session gone" reuse the amber and red
    // dots rather than introducing a fourth class to keep in sync.
    function setStatus(s, label) {
      dot.className = 'status-dot ' + s;
      stText.textContent = label ||
        (s === 'connected' ? 'Connected' : s === 'connecting' ? 'Connecting...' : 'Disconnected');
    }
    function fmtB(b) {
      if (b >= 1e9) return (b/1e9).toFixed(1)+' GB';
      if (b >= 1e6) return (b/1e6).toFixed(1)+' MB';
      if (b >= 1e3) return (b/1e3).toFixed(1)+' KB';
      return b+' B';
    }
    // ── Connection liveness ───────────────────────────────────────────
    // A supervisor DO reset drops this socket SERVER-side without closing
    // it: `ctx.getWebSockets()` comes back empty while the browser still
    // reports readyState === OPEN and fires neither 'close' nor 'error'.
    // ws.onclose — and the reconnect hanging off it — therefore never
    // runs, and the terminal stays open, accepts keystrokes and answers
    // nothing. Measured at 85s and counting.
    //
    // Finding that needs a round trip THE ACTOR answers, which rules out
    // the obvious candidate. `ping` is the socket's configured
    // auto-response (see the worker's ws-hibernation-config.ts), handled
    // by the runtime WITHOUT waking the actor and never delivered to it.
    // On a dead socket, measured on a deployed Worker, a `ping` produces
    // no `pong` AND no close — it is swallowed, so it can neither confirm
    // life nor reveal death. We probe with `fs-watch-unsubscribe`, which
    // session/ws.ts handles at the top of wsMessage — ahead of every
    // terminal lookup, replying on all three paths (ok / not-ok / throw)
    // and touching nothing but an in-memory Map, so it cannot wedge
    // behind session work.
    //
    // Silence is not a verdict: a busy actor is silent too. The
    // discriminator is a second, independent route to the same actor —
    // the /api/stats poll this shell already runs. A FRESH HTTP answer
    // while the socket has gone quiet proves the actor is up and this
    // socket is not. When both channels are quiet we cannot tell dead
    // from slow, so we report that instead of guessing.
    const Conn = (function () {
      // Probe once the socket has been quiet this long...
      const PROBE_AFTER_MS = 4_000;
      // ...and treat the quiet as suspect at this point.
      const SUSPECT_AFTER_MS = 12_000;
      // HTTP evidence older than this says nothing about *now*.
      const HTTP_FRESH_MS = 8_000;
      // Real subscription ids are `sub-<rand>-<ts>`, so this matches none
      // of them and the unsubscribe removes nothing. Omitting subId would
      // drop every subscription on the socket, including FileTree's.
      const PROBE_SUB_ID = 'nimbus-liveness-probe';
      // Statuses the edge uses for a session that is really gone. A
      // network error or a 5xx is indistinguishable from slow and never
      // produces a verdict.
      const GONE_CODES = { 401: 'E_TOKEN_INVALID', 403: 'E_TOKEN_INVALID', 404: 'E_SESSION_404', 410: 'E_SESSION_404' };
      const TICK_MS = 5_000;
      const NAG_MS = 30_000;

      let lastInboundAt = 0;
      let lastHttpOkAt = 0;
      let probeSeq = 0;
      let goneCode = null;
      let everOpened = false;
      let downSince = 0;
      let lastNagAt = 0;
      let lastInputNoticeAt = 0;
      let unresponsive = false;

      const isOpen = () => !!ws && ws.readyState === WebSocket.OPEN;
      const notice = (text, sgr) => term.write('\r\n\x1b[' + sgr + 'm[nimbus] ' + text + '\x1b[0m\r\n');

      /** Any frame at all proves this socket still reaches the actor. */
      function noteInbound() {
        lastInboundAt = Date.now();
        if (!unresponsive) return;
        unresponsive = false;
        setStatus('connected');
      }

      /** Outcome of an /api/stats poll — the independent second channel. */
      function noteHttp(ok, status) {
        if (ok) { lastHttpOkAt = Date.now(); return; }
        const code = GONE_CODES[status];
        if (code) declareGone(code, status);
      }

      function probe() {
        try {
          ws.send(JSON.stringify({
            type: 'fs-watch-unsubscribe',
            subId: PROBE_SUB_ID,
            reqId: 'liveness-' + (++probeSeq),
          }));
        } catch { /* send only throws on a socket already tearing down */ }
      }

      /**
       * Claim the probe's reply. Editor/FileTree ignore it already (both
       * require a numeric reqId); returning true keeps the frame out of
       * the shell dispatch and documents where it lands.
       */
      function tryHandleProbeResult(msg) {
        return msg && msg.type === 'fs-watch-unsubscribe-result' &&
          typeof msg.reqId === 'string' && msg.reqId.startsWith('liveness-');
      }

      function declareDead() {
        downSince = Date.now();
        lastNagAt = downSince;
        notice('connection lost — reconnecting...', '33');
        // Abandon the socket instead of waiting on ws.onclose. A socket
        // the server has already dropped never completes the closing
        // handshake, so close() leaves it CLOSING and the close event
        // arrives ~60s later (measured on a deployed Worker) — long after
        // we already know the answer. Clearing `ws` first makes that late
        // event inert via the generation check in connect(), so
        // reconnecting immediately cannot collide with it.
        const dead = ws;
        ws = null;
        try { dead.close(); } catch { /* already closing */ }
        connect();
      }

      function declareGone(code, status) {
        if (goneCode) return;
        goneCode = code;
        downSince = 0;
        const message = code === 'E_TOKEN_INVALID'
          ? 'This session refused the connection (HTTP ' + status + '). Reload the page to sign in again.'
          : 'This session no longer exists (HTTP ' + status + '). Open a new one to keep working.';
        setStatus('disconnected', 'Session gone');
        notice(message, '31');
        clearNimbusDisconnectError();
        postNimbusEvent('nimbus:error', { code, message });
        try { if (ws) ws.close(); } catch { /* already closing */ }
      }

      function nag(t) {
        if (!downSince || t - lastNagAt < NAG_MS) return;
        lastNagAt = t;
        notice('still reconnecting — ' + Math.round((t - downSince) / 1000) + 's without a connection.', '33');
      }

      function tick() {
        if (goneCode) return;
        const t = Date.now();
        // While the socket is down nothing else polls, so this tick owns
        // the HTTP channel: it keeps the stats panel current and is what
        // classifies a session that is gone rather than merely away.
        if (!isOpen()) { refreshStats(); nag(t); return; }
        // An outage already ruled on is already being handled; re-running
        // the rule below would re-announce and re-dial on every tick.
        if (downSince) { nag(t); return; }
        const quiet = t - lastInboundAt;
        if (quiet >= PROBE_AFTER_MS) probe();
        if (quiet < SUSPECT_AFTER_MS) return;
        if (t - lastHttpOkAt <= HTTP_FRESH_MS) { declareDead(); return; }
        // Both channels quiet. This is the one case we cannot resolve —
        // a wedged socket and a session busy enough to stall an HTTP poll
        // look identical from here — so report the observation, not a
        // verdict, and keep probing. The header carries it immediately
        // because it is the at-a-glance channel and must never read
        // "Connected" while we are saying otherwise; the terminal line
        // waits for NAG_MS so a busy session does not spam the scrollback.
        if (!unresponsive) {
          unresponsive = true;
          setStatus('connecting', 'Not responding');
        }
        if (quiet >= NAG_MS && t - lastNagAt >= NAG_MS) {
          lastNagAt = t;
          notice('no response from the session for ' + Math.round(quiet / 1000) + 's — still waiting.', '33');
        }
      }

      function onOpen() {
        everOpened = true;
        unresponsive = false;   // connect()'s onopen restores the status
        lastInboundAt = Date.now();
        if (!downSince) return;
        downSince = 0;
        // Say only what this side can see. Whether the session survived the
        // gap is the server's to report, and it does on the socket it just
        // accepted — guessing here produced a "may have been interrupted"
        // that was neither a fact nor actionable.
        notice('reconnected.', '32');
      }

      function onClose() {
        if (goneCode || downSince || !everOpened) return;
        downSince = Date.now();
        lastNagAt = downSince;
        notice('connection lost — reconnecting...', '33');
      }

      /** Typing into a socket that is not open must not look accepted. */
      function noteInput() {
        if (isOpen() || !everOpened) return;
        const t = Date.now();
        if (t - lastInputNoticeAt < NAG_MS) return;
        lastInputNoticeAt = t;
        notice(goneCode
          ? 'this session is gone — your input is going nowhere.'
          : 'not connected — your input is not reaching the session.', '33');
      }

      setInterval(tick, TICK_MS);
      return {
        noteInbound, noteHttp, noteInput, onOpen, onClose, tryHandleProbeResult,
        isGone: () => goneCode !== null,
        hasConnected: () => everOpened,
      };
    })();

    function refreshStats() {
      fetch(STATS_URL).then(r => {
        Conn.noteHttp(r.ok, r.status);
        if (!r.ok) throw new Error('stats HTTP ' + r.status);
        return r.json();
      }).then(async s => {
        document.getElementById('stFiles').textContent = s.files + ' files, ' + s.directories + ' dirs';
        document.getElementById('stSize').textContent = fmtB(s.usedBytes);
        if (s.cache) {
          document.getElementById('stCache').textContent = s.cache.entries + '/' + s.cache.maxEntries;
          document.getElementById('stHitRate').textContent = s.cache.hitRate + '%';
        }
        // Pick the active preview backend: wrangler takes precedence
        // over vite when both are running, because users only start
        // wrangler deliberately (vs. vite which auto-starts on certain
        // workflows). If neither is running, we still point at the
        // vite /preview/ URL so its placeholder page renders.
        let kind = 'none';
        if (s.wrangler?.running) kind = 'worker';
        else if (s.vite?.running) kind = 'vite';
        await applyPreviewTarget(kind, s);

        if (s.wrangler?.running) {
          viteStatus.textContent = 'worker running (' + (s.wrangler.name || '?') + ')';
          viteStatus.className = 'vite-status running';
        } else if (s.vite?.running) {
          viteStatus.textContent = 'vite running (' + s.vite.root + ')';
          viteStatus.className = 'vite-status running';
        } else {
          viteStatus.textContent = '';
          viteStatus.className = 'vite-status';
        }
      }).catch(() => {});
    }

    // ── WebSocket ──
    function connect() {
      // A session the server has disowned is not worth redialling; Conn
      // has already told the user why.
      if (Conn.isGone()) return;
      setStatus('connecting', Conn.hasConnected() ? 'Reconnecting...' : null);
      // Every handler below is gated on `sock === ws`, so a socket this
      // one supersedes can no longer write to the terminal, restart the
      // stats poll, or schedule a second reconnect when its own events
      // finally land.
      const sock = new WebSocket(WS_URL);
      ws = sock;
      ws.onopen = () => {
        if (sock !== ws) return;
        clearNimbusDisconnectError();
        Conn.onOpen();
        setStatus('connected'); rd = 1000;
        ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}));
        // Drain any fs-* frames that Editor / FileTree queued before WS
        // opened. Drain order does not matter; the server routes by reqId.
        try { if (typeof Editor !== 'undefined') Editor.drainFsQueue(); } catch {}
        try { if (typeof FileTree !== 'undefined') FileTree.drainFsQueue(); } catch {}
        // Subscribe the FileTree to server-pushed fs-watch-event frames so
        // terminal-side writes appear without a manual refresh click.
        try { if (typeof FileTree !== 'undefined') FileTree.subscribeOnce(); } catch {}
        refreshStats();
        if (statsTimer) clearInterval(statsTimer);
        statsTimer = setInterval(() => {
          refreshStats();
          // Keep the process count + sidebar state reconciled even if a
          // spawn or exit event was dropped during a reconnect or
          // brief network blip. /api/processes is cheap (in-memory).
          if (typeof ProcSidebar !== 'undefined') ProcSidebar.hydrate();
        }, 5000);
        // Initial hydrate — DO is warm, ProcessTable populated.
        if (typeof ProcSidebar !== 'undefined') ProcSidebar.hydrate();
      };
      ws.onmessage = (e) => {
        if (sock !== ws) return;
        // Before any parsing: a frame arriving at all — even a malformed
        // one — is proof this socket still reaches the actor.
        Conn.noteInbound();
        try {
          const msg = JSON.parse(e.data);
          if (Conn.tryHandleProbeResult(msg)) return;
          // fs-*-result frames route to the editor's pending-request
          // resolver. Return early so shell dispatch does not see them
          // as unknown types.
          if (Editor.tryHandleFsResult(msg)) return;
          // FileTree consumes fs-list results too.
          if (FileTree.tryHandleFsResult(msg)) return;
          // Server-pushed fs-watch-event frames route to FileTree, which
          // coalesces per-parent refreshes on a 100ms window.
          if (FileTree.applyWatchEvent(msg)) return;
          if (msg.type === 'output') {
            term.write(msg.data);
            // Snappy preview switch: both vite (/preview/) and wrangler
            // (/worker/, "Worker built") emit recognisable output lines
            // when they come online. Triggering an immediate stats
            // refresh here shaves up to 5s off the otherwise-periodic
            // polling interval so the iframe flips as soon as the user
            // sees the dev-server banner in the terminal.
            if (msg.data.includes('/preview/') ||
                msg.data.includes('/worker/') ||
                msg.data.includes('Worker built') ||
                msg.data.includes('wrangler ready')) {
              refreshStats();
            }
          } else if (msg.type === 'ready') {
            postNimbusReady();
            refreshStats();
          } else if (msg.type === 'hmr') {
            // Forward HMR to preview iframe
            if (previewFrame.contentWindow) {
              previewFrame.contentWindow.postMessage(msg.data, '*');
            }
          } else if (msg.type === 'spawn') {
            // EVERY process the supervisor spawns gets a sidebar entry.
            // Short-lived processes (node foo.js) immediately receive an
            // exit event and the entry flips to "exited" — kept around
            // for 10 min so the user can read the final output. The
            // entry never steals focus from the shell; attached-TTY
            // TUIs (the user's own foreground command) are the one
            // exception and take the view immediately.
            ProcSidebar.upsert(msg.pid, msg.command, {
              attachedTty: msg.attachedTty === true,
            });
          } else if (msg.type === 'exit') {
            // An exit can arrive for a pid we never saw a spawn for
            // (e.g. `node -e`, which the supervisor intentionally
            // suppresses the spawn banner for). Surface those too so
            // the user sees SOMETHING — we add an entry on-exit and
            // mark it exited. The ring buffer keeps the output for
            // 10 min.
            if (!ProcSidebar.has(msg.pid)) {
              ProcSidebar.upsert(msg.pid, msg.command || ('pid ' + msg.pid));
            }
            ProcSidebar.markExit(msg.pid, msg.code, msg.reason);
          }
        } catch {}
      };
      ws.onclose = () => {
        if (sock !== ws) return;
        Conn.onClose();
        if (!Conn.isGone()) setStatus('disconnected');
        scheduleNimbusDisconnectError();
        if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
        setTimeout(() => { rd = Math.min(rd*1.5, 10000); connect(); }, rd);
      };
      ws.onerror = () => { if (sock === ws) sock.close(); };
    }

    term.onData(d => {
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'input',data:d}));
      else Conn.noteInput();
    });
    window.addEventListener('resize', () => {
      // fit() can throw while the shell view is hidden behind a process
      // view (display:none container); the resize frame still matters.
      try { fitAddon.fit(); } catch {}
      if (ws?.readyState === WebSocket.OPEN) ws.send(JSON.stringify({type:'resize',cols:term.cols,rows:term.rows}));
    });

    // ── Process sidebar (VS Code terminal-panel model) ────────────────
    // The shell + every process live as entries in the right-hand
    // sidebar; the .term-main view area shows the shell xterm or ONE
    // process view (logs / TUI) at a time, full height. Every
    // `{type:'spawn'}` adds an entry WITHOUT stealing focus from the
    // shell — clicking an entry attaches `/api/logs/<pid>` and swaps
    // the view; clicking "shell" returns. Attached-TTY processes (TUIs
    // the user launched in the foreground) are the one exception: they
    // attach + take the view immediately, because that IS the user's
    // foreground intent. The ring buffer retains logs for 10 min
    // post-exit, so an entry left after a crash keeps its final output
    // readable until the buffer expires (or the user dismisses it).
    const ProcSidebar = (function() {
      const sidebar = document.getElementById('procSidebar');
      const list = document.getElementById('procList');
      const shellItem = document.getElementById('procShellItem');
      const termMain = document.getElementById('termMain');
      const body = document.getElementById('logsPanelBody');
      const btnProcs = document.getElementById('btnProcs');
      const procsCount = document.getElementById('procsCount');
      /** pid -> { pid, itemEl, viewEl, ws, wsOpened, exited, failed, exitCode, exitReason, label, term, fit, attachedTty } */
      const procs = new Map();
      // pids the user dismissed with ✕ while still running — hydrate()
      // must not resurrect them (it reconciles every 5s and would
      // otherwise re-add, and for TUIs re-steal the view, in a loop).
      const dismissed = new Set();
      // null = shell view; otherwise the pid whose view fills .term-main.
      let activePid = null;
      // User-controlled visibility. `true` = show sidebar when ≥1 entry.
      // `false` = collapsed (chevron or toolbar button). New spawns do
      // NOT force a collapsed sidebar open — the toolbar badge + dot
      // carry the signal instead.
      let userWantsVisible = true;

      // Minimal ANSI CSI stripper — non-terminal fallback views pass ANSI through;
      // we keep stderr coloring via a CSS class rather than trying to
      // faithfully render xterm sequences inside a <pre>.
      const ANSI_RE = /\x1b\[[0-9;?]*[a-zA-Z]|\x1b\][^\x07]*\x07|\x1b[=>()][^\s]?/g;
      function stripAnsi(s) { return s.replace(ANSI_RE, ''); }

      function escapeHtml(s) {
        return s
          .replace(/&/g, '&amp;').replace(/</g, '&lt;')
          .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // Derive a short label from the command: strip argv[0] path prefix,
      // drop anything after the first flag-looking token, cap at ~28 chars.
      function labelFor(command) {
        if (!command) return '';
        const trimmed = command.trim();
        const parts = trimmed.split(/\s+/);
        // Strip env-var prefixes like FOO=bar
        let i = 0;
        while (i < parts.length && /^[A-Z_][A-Z0-9_]*=/.test(parts[i])) i++;
        let display = parts.slice(i, i + 3).join(' ');
        if (display.length > 32) display = display.slice(0, 29) + '…';
        return display || trimmed.slice(0, 32);
      }

      // Refit the shell xterm + push new cols/rows to the server. Called
      // after ANY change to the sidebar's visibility or the active view —
      // the terminal's viewport just grew or shrunk and the shell needs
      // the new size so its line-wrapping stays correct.
      function refitTerminal() {
        try { fitAddon.fit(); } catch {}
        if (ws?.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
        }
      }

      // Refit whichever process terminal currently owns the view. The
      // PaneResizer calls this on drag so a TUI in the panel re-wraps
      // just like the shell does.
      function refitActive() {
        const t = activePid !== null ? procs.get(activePid) : null;
        if (!t?.fit || !t.term) return;
        try { t.fit.fit(); } catch {}
        sendProcessResize(t);
      }

      // Single source of truth for "should the sidebar be visible right
      // now?". It shows iff there's ≥1 entry AND the user hasn't
      // collapsed it. Collapsing while a process view is up returns the
      // view to the shell — a process view with no sidebar would strand
      // the user. The toolbar button is visible iff we've ever seen a
      // process (so brand-new sessions don't get a useless "0 Processes"
      // chip), and its "active" highlight tracks sidebar visibility.
      function applyVisibility() {
        const haveProcs = procs.size > 0;
        const shouldShow = haveProcs && userWantsVisible;
        const wasShown = sidebar.classList.contains('active');
        sidebar.classList.toggle('active', shouldShow);
        if (!shouldShow && activePid !== null) setActive(null);
        else if (wasShown !== shouldShow) { refitTerminal(); refitActive(); }

        // Running vs total — the dot pulses when ≥1 entry is running.
        let running = 0;
        for (const t of procs.values()) if (!t.exited) running++;
        procsCount.textContent = running > 0
          ? (running === procs.size ? String(running) : running + '/' + procs.size)
          : String(procs.size);
        btnProcs.classList.toggle('visible', haveProcs);
        btnProcs.classList.toggle('has-running', running > 0);
        btnProcs.classList.toggle('active', shouldShow);
      }

      // Hard cap on child nodes per view — a long-running `vite` session
      // can produce thousands of chunks per hour; without this, the tab's
      // DOM grows unboundedly and the browser tab eventually becomes
      // sluggish. When over the cap we drop the oldest 20% in one go to
      // amortize layout thrash (vs. one-at-a-time on every render).
      const MAX_NODES_PER_VIEW = 2000;
      const TRIM_BATCH = 400;

      function appendToView(tab, el) {
        // Pre-compute bottom-ness against the actively-rendered view (not
        // the panel body, which might be scrolled by a different tab).
        const view = tab.viewEl;
        const isActive = activePid === tab.pid;
        const atBottom = isActive &&
          (body.scrollHeight - body.scrollTop - body.clientHeight) < 24;
        view.appendChild(el);
        if (view.childElementCount > MAX_NODES_PER_VIEW) {
          // Trim oldest. DocumentFragment swap would be faster for huge
          // drops, but TRIM_BATCH is small and this runs at most once per
          // append so the measured cost is negligible.
          for (let i = 0; i < TRIM_BATCH && view.firstChild; i++) {
            view.removeChild(view.firstChild);
          }
        }
        if (atBottom) body.scrollTop = body.scrollHeight;
      }

      function renderChunk(tab, chunk) {
        if (tab.term) {
          const data = String(chunk.data || '');
          tab.term.write(tab.attachedTty ? data : data.replace(/\n/g, '\r\n'));
          return;
        }
        const span = document.createElement('span');
        span.textContent = stripAnsi(chunk.data);
        if (chunk.binary) span.className = 'binary';
        else if (chunk.stream === 'stderr') span.className = 'stderr';
        appendToView(tab, span);
      }

      function renderBanner(tab, text, cls) {
        if (tab.term) {
          tab.term.write('\r\n' + text + '\r\n');
          return;
        }
        const div = document.createElement('span');
        div.className = 'banner' + (cls ? ' ' + cls : '');
        div.textContent = text;
        appendToView(tab, div);
      }

      // pid === null selects the shell; otherwise the process view fills
      // .term-main. Both directions refit the terminal that just became
      // visible and hand it keyboard focus.
      function setActive(pid) {
        activePid = pid;
        shellItem.classList.toggle('active', pid === null);
        for (const [p, t] of procs) {
          t.itemEl.classList.toggle('active', p === pid);
          t.viewEl.classList.toggle('active', p === pid);
        }
        termMain.classList.toggle('proc-view', pid !== null);
        if (pid === null) {
          setTimeout(() => { refitTerminal(); try { term.focus(); } catch {} }, 0);
          return;
        }
        const tab = procs.get(pid);
        if (tab?.fit) {
          setTimeout(() => {
            try { tab.fit.fit(); } catch {}
            sendProcessResize(tab);
            try { tab.term?.focus(); } catch {}
          }, 0);
        }
        body.scrollTop = body.scrollHeight;
      }

      function sendProcessResize(tab) {
        if (!tab?.term || !tab.ws || tab.ws.readyState !== WebSocket.OPEN) return;
        try {
          tab.ws.send(JSON.stringify({
            type: 'resize',
            columns: tab.term.cols,
            rows: tab.term.rows,
          }));
        } catch {}
      }

      function dismiss(pid) {
        const t = procs.get(pid);
        if (!t) return;
        try { t.ws?.close(); } catch {}
        t.itemEl.remove();
        t.viewEl.remove();
        procs.delete(pid);
        if (!t.exited) dismissed.add(pid);
        // The shell is the primary surface — dismissing whatever was in
        // view always lands back there, never on a sibling process.
        if (activePid === pid) setActive(null);
        applyVisibility();
      }

      // Open the process-terminal WebSocket for a tab, if it hasn't been
      // opened already. Audit R3 / PERF-AUDIT.md: since auto-open-
      // every-spawn landed, every short-lived `node foo.js` opened a
      // persistent log WS that stayed alive 10 min. Every facet
      // stdout chunk then fanned out to every idle subscriber on the
      // DO side, competing with the shell WS for input-gate time and
      // making typing feel laggy.
      //
      // We defer the WS connection until the user actually clicks the
      // sidebar entry. The entry still appears immediately on spawn
      // (good UX — "I see you, here's your process") but the server
      // never ships bytes to a reader nobody's reading. The 95% of
      // short-lived processes that the user never clicks pay zero
      // network/DO cost beyond the initial {spawn}/{exit} frames on
      // the main WS.
      function ensureLogWs(tab) {
        if (tab.wsOpened) return;
        tab.wsOpened = true;
        // Drop anything painted before attach (e.g. an exit banner);
        // backlog + live chunks repopulate the view.
        tab.viewEl.replaceChildren();
        ensureAttachedTerminal(tab);
        const pid = tab.pid;
        const wsUrl = (location.protocol === 'https:' ? 'wss:' : 'ws:') +
                      '//' + location.host + SESSION_PREFIX + '/api/logs/' + pid;
        let logWs;
        try { logWs = new WebSocket(wsUrl); } catch {
          renderBanner(tab, '[process terminal could not be opened]', 'failed');
          return;
        }
        tab.ws = logWs;
        if (tab.term) {
          tab.term.onData((data) => {
            if (logWs.readyState === WebSocket.OPEN) {
              logWs.send(JSON.stringify({ type: 'input', data }));
            }
          });
        }
        logWs.onopen = () => sendProcessResize(tab);
        logWs.onmessage = (ev) => {
          let msg;
          try { msg = JSON.parse(ev.data); } catch { return; }
          if (msg.type === 'backlog') {
            const chunks = msg.chunks || [];
            if (chunks.length === 0) {
              if (!tab.attachedTty) renderBanner(tab, '[process attached; no output captured yet]', '');
            } else {
              for (const c of chunks) renderChunk(tab, c);
            }
            // Attaching to an already-exited process: the backlog alone
            // has no exit marker, so restore it from the recorded exit.
            if (tab.exited) renderExitBanner(tab, tab.exitCode ?? 0, tab.exitReason);
          } else if (msg.type === 'chunk') {
            renderChunk(tab, msg);
          } else if (msg.type === 'exit') {
            markExit(pid, msg.code, msg.reason);
          } else if (msg.type === 'notfound') {
            // Mark exited so the server-side close doesn't emit a second
            // "[process terminal closed]" banner on top of this one.
            tab.exited = true;
            tab.failed = false;
            tab.itemEl.classList.add('exited');
            renderBanner(tab, '[no output captured for pid ' + pid + ']', '');
          }
        };
        logWs.onclose = () => {
          // If we haven't seen an exit yet, this is a server-side tear-down
          // or a network blip. The UI keeps the tab open so the user can
          // still read the backlog; reconnect would require a manual close
          // + reopen via the shell.
          if (!tab.exited) {
            renderBanner(tab, '[process terminal closed]', '');
          }
        };
        logWs.onerror = () => {
          renderBanner(tab, '[process terminal error]', 'failed');
        };
      }

      // Add (or update) the sidebar entry for a pid. Never steals focus
      // from the shell — the entry appears with a brief flash and the
      // toolbar badge ticks up. The single exception: attached-TTY
      // processes (interactive TUIs the user just launched in the
      // foreground) attach + take the view immediately on first sight.
      function upsert(pid, command, options) {
        const attachedTty = !!(options && options.attachedTty);
        if (procs.has(pid)) {
          const existing = procs.get(pid);
          if (options && Object.hasOwn(options, 'attachedTty')) {
            existing.attachedTty = attachedTty;
          }
          // Spawn frame promoting a hydrated entry to TUI: attach once.
          // View first, then the terminal — xterm must open inside a
          // visible container or it measures 0×0 and renders nothing.
          if (attachedTty && !existing.wsOpened && !existing.exited) {
            userWantsVisible = true;
            setActive(pid);
            ensureLogWs(existing);
            applyVisibility();
          }
          return;
        }
        dismissed.delete(pid);

        const label = labelFor(command);
        const itemEl = document.createElement('div');
        itemEl.className = 'proc-item';
        itemEl.title = 'pid ' + pid + ': ' + (command || '(unknown)');
        itemEl.innerHTML =
          '<span class="proc-dot"></span>' +
          '<span class="proc-label"></span>' +
          '<span class="proc-pid">#' + pid + '</span>' +
          // Actions surface on hover (they swap in for the pid). Kill
          // tears the process down; Restart = kill + spawn fresh (vite
          // only); ✕ only dismisses the local entry.
          '<span class="proc-actions">' +
            '<span class="proc-act proc-act-restart" title="Restart process (kill + spawn fresh; vite only)">↻</span>' +
            '<span class="proc-act proc-act-kill" title="Kill process">⏹</span>' +
            '<span class="proc-act proc-act-close" title="Dismiss entry (process keeps running)">✕</span>' +
          '</span>';
        itemEl.querySelector('.proc-label').textContent = label;
        itemEl.addEventListener('click', (e) => {
          const target = e.target;
          if (target.classList && target.classList.contains('proc-act')) return;
          // User click: the signal that they want to read the process
          // terminal. Swap the view FIRST — xterm must open inside a
          // visible container or it measures 0×0 and renders nothing —
          // then open the WS if it isn't already.
          setActive(pid);
          const t = procs.get(pid);
          if (t) ensureLogWs(t);
        });
        itemEl.querySelector('.proc-act-close').addEventListener('click', (e) => {
          e.stopPropagation();
          dismiss(pid);
        });
        const sendAction = async (action) => {
          // POST /api/<action>/<pid>; surface failures as a banner inside
          // the view so the user sees WHY without hunting in network tools.
          let resp;
          try {
            resp = await fetch(SESSION_PREFIX + '/api/' + action + '/' + pid, {
              method: 'POST', cache: 'no-store',
            });
          } catch (err) {
            const t = procs.get(pid);
            if (t) renderBanner(t, '[' + action + ' failed: network] ' + (err && err.message || err), 'failed');
            return;
          }
          const t = procs.get(pid);
          if (!t) return;
          if (!resp.ok) {
            let msg = '[' + action + ' failed: HTTP ' + resp.status + ']';
            try {
              const j = await resp.json();
              if (j && j.error) msg += ' ' + j.error;
            } catch {}
            renderBanner(t, msg, 'failed');
            return;
          }
          renderBanner(t, '[' + action + ' requested]', 'ok');
        };
        itemEl.querySelector('.proc-act-kill').addEventListener('click', (e) => {
          e.stopPropagation();
          sendAction('kill');
        });
        itemEl.querySelector('.proc-act-restart').addEventListener('click', (e) => {
          e.stopPropagation();
          sendAction('restart');
        });

        const viewEl = document.createElement('div');
        viewEl.className = 'logs-view';
        viewEl.dataset.pid = String(pid);

        list.appendChild(itemEl);
        body.appendChild(viewEl);

        const tab = { pid, itemEl, viewEl, ws: null, wsOpened: false, exited: false, failed: false, label, term: null, fit: null, attachedTty };
        procs.set(pid, tab);
        itemEl.classList.add('fresh');
        itemEl.addEventListener('animationend', () => itemEl.classList.remove('fresh'), { once: true });
        if (attachedTty) {
          userWantsVisible = true;
          setActive(pid);
          ensureLogWs(tab);
        }
        applyVisibility();
      }

      function ensureAttachedTerminal(tab) {
        if (tab.term) return;
        tab.viewEl.classList.add('terminal-view');
        const procTerm = new Terminal({
          cursorBlink: true,
          cursorStyle: 'bar',
          fontSize: 12,
          fontFamily: "'JetBrains Mono', 'Fira Code', Menlo, monospace",
          theme: {
            background: '#0d1117', foreground: '#c9d1d9', cursor: '#58a6ff', selectionBackground: '#264f78',
            black: '#484f58', red: '#ff7b72', green: '#3fb950', yellow: '#d29922',
            blue: '#58a6ff', magenta: '#bc8cff', cyan: '#39d353', white: '#c9d1d9',
            brightBlack: '#6e7681', brightRed: '#ffa198', brightGreen: '#56d364', brightYellow: '#e3b341',
            brightBlue: '#79c0ff', brightMagenta: '#d2a8ff', brightCyan: '#56d364', brightWhite: '#f0f6fc',
          },
          allowProposedApi: true,
          macOptionIsMeta: true,
        });
        const procFit = new FitAddon.FitAddon();
        procTerm.loadAddon(procFit);
        procTerm.open(tab.viewEl);
        try { procFit.fit(); } catch {}
        tab.term = procTerm;
        tab.fit = procFit;
        setTimeout(() => {
          try { procTerm.focus(); } catch {}
        }, 0);
      }

      window.addEventListener('resize', () => {
        for (const tab of procs.values()) {
          if (!tab.fit || !tab.term) continue;
          try { tab.fit.fit(); } catch {}
          sendProcessResize(tab);
        }
      });

      function renderExitBanner(tab, code, reason) {
        const reasonSuffix = reason ? ' (' + reason + ')' : '';
        renderBanner(
          tab,
          '[process exited with code ' + code + reasonSuffix + ' — entry kept; dismiss with ✕]',
          code === 0 ? 'ok' : 'failed',
        );
      }

      function markExit(pid, code, reason) {
        const tab = procs.get(pid);
        if (!tab) return;
        if (tab.exited) return; // idempotent — server + log-WS may both fire
        tab.exited = true;
        tab.failed = code !== 0;
        tab.exitCode = code;
        tab.exitReason = reason;
        tab.itemEl.classList.add('exited');
        if (tab.failed) tab.itemEl.classList.add('failed');
        // Update the dot color via the class; append the exit banner.
        renderExitBanner(tab, code, reason);
        // Running-count changed; refresh toolbar badge.
        applyVisibility();
      }

      // Restore any processes already in the DO's ring buffer / process
      // table when the page loads. Covers two cases: (a) full page
      // refresh mid-session — the DO's process table persists, so the
      // sidebar should list every running process (and a foreground TUI
      // should re-take the view); (b) main WS reconnect after a
      // transient network blip — same table, same goal.
      //
      // Entries appear for ALL state='running' processes so users see
      // everything happening. Exited ones stay accessible via `logs
      // <pid>` in the shell for 10 min, but we don't auto-add them
      // here because that would clutter the sidebar after a handful of
      // short-lived commands. Entries the user dismissed with ✕ stay
      // dismissed.
      function hydrate() {
        fetch(SESSION_PREFIX + '/api/processes', { cache: 'no-store' })
          .then(r => r.ok ? r.json() : null)
          .then(data => {
            if (!data?.processes) return;
            for (const p of data.processes) {
              if (p.state === 'running' && !procs.has(p.pid) && !dismissed.has(p.pid)) {
                upsert(p.pid, p.command, { attachedTty: p.attachedTty === true });
              } else if (p.state !== 'running') {
                dismissed.delete(p.pid);
                if (procs.has(p.pid)) {
                  // Server says exited; reconcile in case our main-WS
                  // exit event got dropped during reconnect.
                  markExit(p.pid, p.exitCode ?? 0, undefined);
                }
              }
            }
            applyVisibility();
          })
          .catch(() => {});
      }

      // Toolbar button + head chevron: toggle user-facing visibility.
      // Clicking with no entries is a no-op (the button is hidden via
      // CSS in that state anyway).
      btnProcs.addEventListener('click', () => {
        userWantsVisible = !sidebar.classList.contains('active');
        applyVisibility();
      });
      document.getElementById('btnProcSidebarHide').addEventListener('click', () => {
        userWantsVisible = false;
        applyVisibility();
      });
      shellItem.addEventListener('click', () => setActive(null));

      return {
        upsert, markExit, hydrate, refitActive,
        has: (pid) => procs.has(pid),
      };
    })();
    // ProcSidebar.hydrate is invoked from ws.onopen above — the DO is
    // warm and ProcessTable is populated by then, no arbitrary delay
    // needed.

    term.focus();
    // Restore persisted pane dims before activating layout so the first paint
    // shows the user's prior arrangement.
    PaneResizer.restoreDims();
    const initialMode = new URLSearchParams(location.search).get('agent') === '1'
      ? 'agent'
      : 'editor';
    setLayout(initialMode);
    connect();
  </script>
</body>
</html>
