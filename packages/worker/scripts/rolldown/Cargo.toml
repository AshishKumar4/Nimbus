# Workspace for the single-threaded rolldown binding build (build-binding.mjs).
#
# build-binding.mjs copies this directory into its work directory and
# extracts the pinned upstream source beside it as rolldown-<version>/. The
# workspace root is the directory that holds BOTH, so cargo hashes every path
# crate (upstream's included) by its path relative to here: the same symbol
# hashes, and the same bytes, from any work directory. Upstream is its own
# workspace (its crates inherit from rolldown-<version>/Cargo.toml), so it is
# excluded rather than adopted.

[workspace]
members = ["binding"]
exclude = ["rolldown-1.2.11"]
resolver = "2"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
# Keep the wasm name section: a trap in the binding then names the Rust
# function it happened in instead of `wasm-function[12345]`.
debug = false
strip = "debuginfo"
